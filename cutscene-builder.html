<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PARALLAX — pixel cutscene builder</title>
<style>
/* ── tokens ───────────────────────────────────────────────── */
:root{
  --ink:#080a16;        /* deepest */
  --panel:#101427;
  --panel2:#161b33;
  --line:#232a4d;
  --line2:#2f3862;
  --txt:#c9d2f0;
  --dim:#6d78a8;
  --cyan:#3ee0d8;
  --mag:#ff4fa3;
  --amber:#ffc85c;
  --violet:#9a6bff;
  --r:3px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--ink);color:var(--txt);
  font:12px/1.45 ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  overflow:hidden;-webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:var(--ink)}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:9px}
::-webkit-scrollbar-thumb:hover{background:var(--violet)}
:focus-visible{outline:2px solid var(--cyan);outline-offset:1px}

/* ── shell ────────────────────────────────────────────────── */
#app{display:grid;grid-template-columns:210px 1fr 288px;grid-template-rows:38px 1fr;height:100%}
header{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:0 10px;
  background:linear-gradient(180deg,var(--panel2),var(--panel));border-bottom:1px solid var(--line)}
.logo{font-weight:700;letter-spacing:.22em;font-size:11px;color:var(--cyan)}
.logo b{color:var(--mag);font-weight:700}
.hsub{color:var(--dim);font-size:10px;letter-spacing:.1em;padding-right:6px;border-right:1px solid var(--line);margin-right:2px}
header .sp{flex:1}
aside{background:var(--panel);overflow:hidden;display:flex;flex-direction:column}
#left{border-right:1px solid var(--line)}
#right{border-left:1px solid var(--line)}
main{background:#05060e;display:flex;flex-direction:column;overflow:hidden;position:relative}

/* ── generic ui ───────────────────────────────────────────── */
.sect{border-bottom:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.sect.grow{flex:1}
.sh{display:flex;align-items:center;gap:6px;padding:6px 8px;background:var(--panel2);
  font-size:10px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase;flex:none}
.sh .sp{flex:1}
.body{overflow:auto;padding:6px;min-height:0}
button{background:var(--panel2);border:1px solid var(--line2);border-radius:var(--r);
  padding:4px 8px;cursor:pointer;transition:.12s;white-space:nowrap}
button:hover{border-color:var(--violet);background:#1d2445}
button.p{background:linear-gradient(180deg,#2a2f5c,#1b2044);border-color:var(--violet);color:#e6ebff}
button.p:hover{background:linear-gradient(180deg,#353c78,#232a58)}
button.sm{padding:2px 6px;font-size:10px}
button.ic{padding:2px 5px;font-size:11px;line-height:1;min-width:20px}
button:disabled{opacity:.35;cursor:not-allowed}
input,select{background:var(--ink);border:1px solid var(--line2);border-radius:var(--r);padding:3px 5px;width:100%}
input[type=color]{padding:0;height:20px;width:30px;border:1px solid var(--line2);cursor:pointer;background:none}
input[type=checkbox]{width:auto;accent-color:var(--cyan);cursor:pointer}
input[type=range]{-webkit-appearance:none;appearance:none;background:none;height:16px;padding:0;border:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:3px;background:var(--line2);border-radius:3px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:2px;
  background:var(--cyan);margin-top:-4px;border:0}
input[type=range]::-moz-range-track{height:3px;background:var(--line2);border-radius:3px}
input[type=range]::-moz-range-thumb{width:11px;height:11px;border-radius:2px;background:var(--cyan);border:0}
label{color:var(--dim);font-size:10px;letter-spacing:.04em}
.row{display:grid;grid-template-columns:64px 1fr 46px;gap:6px;align-items:center;padding:2px 4px}
.row>label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .num{text-align:right;font-size:10px;padding:2px 3px}
.row2{display:grid;grid-template-columns:64px 1fr;gap:6px;align-items:center;padding:3px 4px}
.grp{margin:4px 0 8px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.grp>.gt{background:#131832;padding:4px 7px;font-size:10px;letter-spacing:.14em;color:var(--dim);
  text-transform:uppercase;cursor:pointer;display:flex;gap:5px;align-items:center;user-select:none}
.grp>.gt::before{content:"▾";font-size:8px;color:var(--violet)}
.grp.cl>.gt::before{content:"▸"}
.grp.cl>.gc{display:none}
.gc{padding:4px 2px}
.hint{color:var(--dim);font-size:10px;padding:8px;line-height:1.6}
.tag{font-size:9px;letter-spacing:.1em;padding:1px 5px;border-radius:2px;background:var(--line);color:var(--dim)}

/* ── shot filmstrip (signature) ───────────────────────────── */
.shot{display:flex;gap:7px;align-items:stretch;padding:6px;border:1px solid var(--line);
  border-radius:var(--r);background:var(--panel2);cursor:pointer;position:relative}
.shot:hover{border-color:var(--line2)}
.shot.on{border-color:var(--cyan);background:#152040;box-shadow:inset 2px 0 0 var(--cyan)}
.shot .n{font-size:15px;color:var(--dim);font-weight:700;line-height:1;min-width:16px}
.shot.on .n{color:var(--cyan)}
.shot .meta{flex:1;min-width:0}
.shot .nm{font-size:11px;color:var(--txt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shot .sub{font-size:9px;color:var(--dim);letter-spacing:.06em;margin-top:2px}
.shot .acts{display:none;position:absolute;right:4px;top:4px;gap:2px}
.shot:hover .acts,.shot.on .acts{display:flex}
/* transition chip = the connective tissue between shots */
.tr{display:flex;align-items:center;gap:6px;margin:0 0 0 14px;padding:2px 0;cursor:pointer}
.tr .bar{width:2px;height:14px;background:var(--line2)}
.tr .chip{font-size:9px;letter-spacing:.1em;color:var(--violet);border:1px dashed var(--line2);
  border-radius:2px;padding:1px 6px;text-transform:uppercase}
.tr:hover .chip{border-color:var(--violet);color:var(--cyan)}

/* ── layer stack (depth reads as indentation) ─────────────── */
.lay{display:flex;align-items:center;gap:5px;padding:3px 4px;border-radius:var(--r);cursor:pointer;
  border:1px solid transparent}
.lay:hover{background:#161c38}
.lay.on{background:#1b2550;border-color:var(--cyan)}
.lay .dep{width:3px;border-radius:2px;height:16px;flex:none}
.lay .eye{width:16px;text-align:center;color:var(--dim);font-size:10px;flex:none}
.lay .eye.off{opacity:.3}
.lay .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px}
.lay .kd{font-size:8px;letter-spacing:.08em;color:var(--dim);text-transform:uppercase}

/* ── assets ───────────────────────────────────────────────── */
.assets{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:5px}
.as{border:1px solid var(--line);border-radius:var(--r);background:#0b0e1e;cursor:pointer;overflow:hidden;position:relative}
.as:hover{border-color:var(--cyan)}
.as .thumb{height:44px;display:flex;align-items:center;justify-content:center;
  background-image:linear-gradient(45deg,#141830 25%,transparent 25%),linear-gradient(-45deg,#141830 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#141830 75%),linear-gradient(-45deg,transparent 75%,#141830 75%);
  background-size:8px 8px;background-position:0 0,0 4px,4px -4px,-4px 0}
.as img{max-width:100%;max-height:100%;image-rendering:pixelated}
.as .cap{font-size:8px;padding:2px 3px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-top:1px solid var(--line)}
.as .x{position:absolute;top:1px;right:1px;display:none;background:#000a;border:0;padding:0 3px;font-size:10px;color:var(--mag)}
.as .bgk{position:absolute;top:1px;left:1px;display:none;background:#000a;border:0;padding:0 3px;font-size:10px;color:var(--cyan)}
.as:hover .x,.as:hover .bgk{display:block}
#bgPrev{width:100%;max-height:230px;object-fit:contain;image-rendering:pixelated;
  background-image:linear-gradient(45deg,#1a1f3a 25%,transparent 25%),linear-gradient(-45deg,#1a1f3a 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#1a1f3a 75%),linear-gradient(-45deg,transparent 75%,#1a1f3a 75%);
  background-size:14px 14px;background-position:0 0,0 7px,7px -7px,-7px 0;border:1px solid var(--line)}
.keysw{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}
.keysw button{display:flex;align-items:center;gap:5px;font-size:10px;padding:3px 6px}
.keysw .dot{width:12px;height:12px;border-radius:2px;border:1px solid var(--line2)}
.keysw button.on{border-color:var(--cyan);background:#16305c}

/* ── stage ────────────────────────────────────────────────── */
#stagewrap{flex:1;display:flex;align-items:center;justify-content:center;overflow:auto;padding:16px;position:relative}
#stagebox{position:relative;box-shadow:0 0 0 1px var(--line2),0 18px 60px #000c}
#stage{display:block;image-rendering:pixelated;image-rendering:crisp-edges}
#stagebox.chk{background-image:linear-gradient(45deg,#1a1f3a 25%,transparent 25%),linear-gradient(-45deg,#1a1f3a 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#1a1f3a 75%),linear-gradient(-45deg,transparent 75%,#1a1f3a 75%);
  background-size:12px 12px;background-position:0 0,0 6px,6px -6px,-6px 0}
#guides{position:absolute;inset:0;pointer-events:none}

/* ── transport ────────────────────────────────────────────── */
#transport{flex:none;border-top:1px solid var(--line);background:var(--panel);padding:7px 10px;
  display:flex;flex-direction:column;gap:6px}
.tline{position:relative;height:26px;background:var(--ink);border:1px solid var(--line);border-radius:var(--r);
  display:flex;overflow:hidden;cursor:pointer}
.tseg{position:relative;border-right:1px solid var(--line);display:flex;align-items:center;justify-content:center;
  font-size:9px;color:var(--dim);letter-spacing:.1em;overflow:hidden;min-width:0}
.tseg.on{background:#1a2447;color:var(--cyan)}
.tseg .trin{position:absolute;left:0;top:0;bottom:0;background:repeating-linear-gradient(45deg,#9a6bff22,#9a6bff22 3px,transparent 3px,transparent 6px);border-right:1px solid var(--violet)}
#wave{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;display:none;z-index:0}
#ph{position:absolute;top:0;bottom:0;width:1px;background:var(--mag);pointer-events:none;box-shadow:0 0 6px var(--mag);z-index:2}
#ph::before{content:"";position:absolute;top:0;left:-3px;border-left:3.5px solid transparent;border-right:3.5px solid transparent;border-top:5px solid var(--mag)}
.tbar{display:flex;align-items:center;gap:7px;font-size:10px;color:var(--dim)}
.tbar .t{color:var(--cyan);font-variant-numeric:tabular-nums;letter-spacing:.05em}

/* tabs */
.tabs{display:flex;background:var(--panel2);border-bottom:1px solid var(--line);flex:none;overflow-x:auto}
.tabs button{border:0;border-radius:0;background:none;padding:6px 8px;font-size:10px;letter-spacing:.1em;
  color:var(--dim);text-transform:uppercase;border-bottom:2px solid transparent}
.tabs button:hover{background:#1a2040;color:var(--txt)}
.tabs button.on{color:var(--cyan);border-bottom-color:var(--cyan);background:#131a36}

/* graph editor */
#graphWrap{display:none;position:relative;height:172px;margin-top:5px;background:var(--ink);
  border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
#graphWrap.on{display:block}
#graph{position:absolute;inset:0;width:100%;height:100%}
#graphKeys{position:absolute;inset:0}
#graphKeys .gk{position:absolute;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;transform:rotate(45deg);
  border:1px solid #0a0d1c;border-radius:1px;cursor:move}
#graphKeys .gk:hover{box-shadow:0 0 6px currentColor;z-index:3}
#graphLeg{position:absolute;left:6px;top:4px;display:flex;gap:8px;flex-wrap:wrap;
  font-size:9px;letter-spacing:.06em;pointer-events:none}
#graphLeg span{display:flex;align-items:center;gap:3px}
#graphLeg i{width:7px;height:2px;display:inline-block}

/* keyframes */
.row.kf{grid-template-columns:60px 1fr 42px 18px}
.dia{border:0;background:none;color:var(--line2);padding:0;font-size:10px;min-width:14px}
.dia:hover{background:none;color:var(--cyan)}
.dia.k1{color:var(--violet)}
.dia.k2{color:var(--cyan);text-shadow:0 0 5px var(--cyan)}
#klane{position:relative;height:20px;background:var(--ink);border:1px solid var(--line);
  border-radius:var(--r);overflow:hidden;margin-top:5px}
#klane .lbl{position:absolute;left:5px;top:4px;font-size:9px;color:var(--dim);letter-spacing:.1em;pointer-events:none}
#klane .kd{position:absolute;top:5px;width:9px;height:9px;margin-left:-4.5px;transform:rotate(45deg);
  background:var(--cyan);border:1px solid #0a0d1c;cursor:ew-resize;border-radius:1px}
#klane .kd.shot{background:var(--violet)}
#klane .kd:hover{background:var(--mag);z-index:2}
#klane .stop{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(90deg,#ffc85c33,#ffc85c33 2px,transparent 2px,transparent 5px);
  border-left:1px solid var(--amber);border-right:1px solid var(--amber)}
#klane .mkr{position:absolute;top:0;bottom:0;width:1px;background:var(--amber);opacity:.75}
#klane .mkrlbl{position:absolute;left:3px;top:0;font-size:8px;color:var(--amber);
  white-space:nowrap;pointer-events:none;letter-spacing:.06em}
#klane .evm{position:absolute;top:2px;width:5px;height:5px;margin-left:-2.5px;background:#7dffc8;
  border-radius:1px;box-shadow:0 0 4px #7dffc8}
#klane .ph2{position:absolute;top:0;bottom:0;width:1px;background:var(--mag)}
#stage{cursor:grab}
#stage.dragging{cursor:grabbing}
.swatches{display:flex;flex-wrap:wrap;gap:3px;padding:4px}
.sw{width:18px;height:18px;border:1px solid var(--line2);border-radius:2px;cursor:pointer;padding:0}
.pair{display:flex;align-items:center;gap:4px;padding:2px 4px}
.pair .arrow{color:var(--dim);font-size:10px}

/* toast + modal */
#toast{position:fixed;bottom:14px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;
  background:var(--panel2);border:1px solid var(--violet);border-radius:var(--r);padding:7px 14px;
  pointer-events:none;transition:.2s;z-index:99;font-size:11px}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:98}
#modal.on{display:flex}
.mbox{background:var(--panel);border:1px solid var(--line2);border-radius:var(--r);padding:16px;
  max-width:440px;width:90%;max-height:80vh;overflow:auto}
.mbox h3{font-size:12px;letter-spacing:.14em;color:var(--cyan);text-transform:uppercase;margin-bottom:10px}
.mbox p{font-size:11px;color:var(--dim);line-height:1.7;margin-bottom:8px}
.mbox code{background:var(--ink);padding:1px 4px;border-radius:2px;color:var(--amber)}
.mrow{display:flex;gap:6px;justify-content:flex-end;margin-top:12px}
#bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:8px;display:none}
#bar.on{display:block}
#bar>div{height:100%;background:var(--cyan);width:0}
@media (max-width:900px){
  #app{grid-template-columns:1fr;grid-template-rows:38px auto 1fr auto}
  aside{max-height:34vh;border:0;border-bottom:1px solid var(--line)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="logo">PARA<b>LLAX</b></span>
    <span class="hsub">cutscene builder · v1.9-bd</span>
    <button class="sm" id="bNew">New</button>
    <button class="sm" id="bOpen">Open</button>
    <button class="sm" id="bSave">Save</button>
    <span id="saveTag" style="font-size:10px;color:var(--dim);letter-spacing:.05em"></span>
    <span id="syncTag" style="font-size:10px;letter-spacing:.05em"></span>
    <span class="sp"></span>
    <button class="ic" id="bUndo" title="Undo (Ctrl+Z)">↶</button>
    <button class="ic" id="bRedo" title="Redo (Ctrl+Shift+Z)">↷</button>
    <button class="sm" id="bHelp">?</button>
  </header>

  <aside id="left">
    <div class="sect grow">
      <div class="sh">Shots<span class="sp"></span>
        <button class="ic" id="bAddShot" title="Add shot">+</button>
      </div>
      <div class="body" id="shotList"></div>
    </div>
    <div class="sect" style="max-height:44%">
      <div class="sh">Assets<span class="sp"></span>
        <button class="sm" id="bImport">Import…</button>
      </div>
      <div class="body"><div class="assets" id="assetList"></div>
        <div class="hint" id="assetHint">Drop PNGs or GIFs anywhere, or click Import. GIFs are sliced into sprite sheets automatically. Click an asset to load it into the selected layer.</div>
      </div>
    </div>
  </aside>

  <main>
    <div id="stagewrap">
      <div id="stagebox" class="chk"><canvas id="stage"></canvas><canvas id="guides"></canvas></div>
    </div>
    <div id="transport">
      <div class="tline" id="tline"><canvas id="wave"></canvas><div id="ph"></div></div>
      <div id="klane"><div class="lbl" id="klabel"></div><div class="ph2" id="ph2"></div></div>
      <div id="graphWrap"><canvas id="graph"></canvas><div id="graphKeys"></div></div>
      <div class="tbar">
        <button class="ic" id="bStart" title="Go to start">⏮</button>
        <button class="p" id="bPlay" style="min-width:56px">▶ Play</button>
        <button class="ic" id="bEnd" title="Go to end">⏭</button>
        <label style="display:flex;gap:4px;align-items:center;cursor:pointer"><input type="checkbox" id="cLoop" checked>loop</label>
        <label style="display:flex;gap:4px;align-items:center;cursor:pointer"><input type="checkbox" id="cSolo">solo shot</label>
      <button class="ic" id="bLoopA" title="Loop start at playhead">[</button>
      <button class="ic" id="bLoopB" title="Loop end at playhead">]</button>
      <button class="ic" id="bLoopX" title="Clear loop">⨯</button>
        <span class="sp" style="flex:1"></span>
        <span class="t" id="tTime">0.00 / 0.00s</span>
        <span style="color:var(--line2)">|</span>
        <label>zoom</label>
        <select id="selZoom" style="width:58px"><option value="0">fit</option><option>1</option><option>2</option><option selected>3</option><option>4</option><option>6</option><option>8</option></select>
        <button class="ic" id="bChk" title="Toggle transparency checker">▦</button>
        <button class="ic" id="bGuide" title="Toggle guides">⊞</button>
      <button class="ic" id="bOnion" title="Onion skin — ghost the selected layer at neighbouring keys">◍</button>
      <button class="ic" id="bSolo" title="Solo the selected layer">◎</button>
      <button class="ic" id="bGraph" title="Graph editor — value curves across the shot">∿</button>
      </div>
    </div>
  </main>

  <aside id="right">
    <div class="sect" style="max-height:38%">
      <div class="sh">Layers <span class="tag" id="layDepthTag">front → back</span><span class="sp"></span>
        <button class="ic" id="bLayUp" title="Move forward">▲</button>
        <button class="ic" id="bLayDn" title="Move back">▼</button>
        <button class="ic" id="bLayCopy" title="Copy layer (works across shots)">⎘</button>
        <button class="ic" id="bLayPaste" title="Paste layer">⎗</button>
        <button class="ic" id="bLayDup" title="Duplicate">⧉</button>
        <button class="ic" id="bLayDel" title="Delete">✕</button>
      </div>
      <div class="body" id="layerList"></div>
      <div style="display:flex;gap:4px;padding:5px;border-top:1px solid var(--line);flex:none">
        <button class="sm" data-addlayer="image" style="flex:1">+ Image</button>
        <button class="sm" data-addlayer="anim" style="flex:1">+ Anim</button>
        <button class="sm" data-addlayer="solid" style="flex:1">+ Solid</button>
        <button class="sm" data-addlayer="text" style="flex:1">+ Text</button>
        <button class="sm" data-addlayer="panel" style="flex:1">+ Panel</button>
        <button class="sm" data-addlayer="distort" style="flex:1">+ Distort</button>
      </div>
    </div>
    <div class="tabs" id="tabs">
      <button data-tab="layer" class="on">Layer</button>
      <button data-tab="shot">Shot</button>
      <button data-tab="fx">FX</button>
      <button data-tab="cam">Cam</button>
      <button data-tab="units">Units</button>
      <button data-tab="proj">Proj</button>
      <button data-tab="out">Export</button>
    </div>
    <div class="body" id="insp" style="flex:1"></div>
  </aside>
</div>

<div id="toast"></div>
<div id="modal"><div class="mbox" id="mbox"></div></div>
<input type="file" id="fileImg" accept="image/*,.gif" multiple hidden>
<input type="file" id="fileProj" accept=".json,application/json" hidden>
<input type="file" id="fileProjMulti" accept=".json,application/json,.parallax.json" multiple hidden>
<input type="file" id="fileAud" accept="audio/*" multiple hidden>
<input type="file" id="fileUnits" accept=".json,application/json" hidden>

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════
   PARALLAX — pixel-art cutscene builder
   One shot = a stack of layers + camera + grade. An "animation
   cut" is just a shot whose layers happen to be sprite sheets.
   ═══════════════════════════════════════════════════════════ */

/* ── GIF decoding ───────────────────────────────────────────
   Dependency-free GIF87a/89a reader. Canvas only ever draws the
   first frame of a GIF, so we decode every frame ourselves and
   lay them out as a sprite sheet the anim layer can slice. */
function lzwDecode(data, minCode, npix) {
  const out = new Uint8Array(npix);
  const CLEAR = 1 << minCode, EOI = CLEAR + 1;
  const prefix = new Int32Array(4096), suffix = new Uint8Array(4096), stack = new Uint8Array(4097);
  for (let i = 0; i < CLEAR; i++) { prefix[i] = -1; suffix[i] = i; }
  let codeSize, mask, avail, oldCode, first = 0;
  const reset = () => { codeSize = minCode + 1; mask = (1 << codeSize) - 1; avail = EOI + 1; oldCode = -1; };
  reset();
  let bits = 0, cur = 0, bp = 0, o = 0, sp = 0;
  while (o < npix) {
    while (bits < codeSize) {
      if (bp >= data.length) return out;
      cur |= data[bp++] << bits; bits += 8;
    }
    const code = cur & mask; cur >>>= codeSize; bits -= codeSize;
    if (code === CLEAR) { reset(); continue; }
    if (code === EOI) break;
    if (oldCode === -1) { out[o++] = suffix[code]; oldCode = code; first = suffix[code]; continue; }
    let inCode = code;
    if (code >= avail) { stack[sp++] = first; inCode = oldCode; }
    while (inCode >= CLEAR) { stack[sp++] = suffix[inCode]; inCode = prefix[inCode]; }
    first = suffix[inCode]; stack[sp++] = first;
    while (sp > 0 && o < npix) out[o++] = stack[--sp];
    if (avail < 4096) {
      prefix[avail] = oldCode; suffix[avail] = first; avail++;
      if ((avail & mask) === 0 && avail < 4096) { codeSize++; mask = (1 << codeSize) - 1; }
    }
    oldCode = code;
  }

}

function decodeGIF(buffer) {

    while ((len = u8())) { parts.push(d.subarray(p, p + len)); p += len; total += len; }

/* full-frame RGBA frames -> one horizontal sprite sheet */
function gifToSheet(g) {
  const N = g.frames.length, W = g.width, H = g.height;
  const c = document.createElement('canvas');
  c.width = W * N; c.height = H;
  const x = c.getContext('2d');
  for (let i = 0; i < N; i++) {
    const im = x.createImageData(W, H);
    im.data.set(g.frames[i].rgba);
    x.putImageData(im, i * W, 0);
  }
  const delays = g.frames.map(f => f.delay);
  const avg = delays.reduce((a, b) => a + b, 0) / N;
  return {
    canvas: c, frameW: W, frameH: H, count: N,
    fps: Math.max(1, Math.min(60, Math.round(100 / Math.max(1, avg))))
  };
}

/* ── sheet & background tooling ─────────────────────────
   Generated sprite sheets arrive with baked-in backdrops
   (magenta keys, white, editor checkerboards) and irregular
   grids. These read the pixels and work it out. */
function pixelsOf(a) {
  const c = document.createElement('canvas'); c.width = a.w; c.height = a.h;
  const x = c.getContext('2d', { willReadFrequently: true });
  x.imageSmoothingEnabled = false; x.drawImage(a.img, 0, 0);

  catch (e) { return null; }
}
/* what is the backdrop, if any? */

  const d = P0.data.data, W = a.w, H = a.h;
  let clear = 0;
  for (let i = 3; i < d.length; i += 4) if (d[i] < 8) clear++;

  const add = i => { const k = (d[i] << 16) | (d[i + 1] << 8) | d[i + 2]; hist.set(k, (hist.get(k) || 0) + 1); };
  for (let x = 0; x < W; x++) { add(x * 4); add(((H - 1) * W + x) * 4); }
  for (let y = 0; y < H; y++) { add(y * W * 4); add((y * W + W - 1) * 4); }
  const ring = 2 * (W + H);
  const top = [...hist.entries()].sort((p, q) => q[1] - p[1]).slice(0, 3)
    .map(([k, c]) => ({ hex: '#' + k.toString(16).padStart(6, '0'), frac: c / ring, from: 'edge' }));

  const gh = new Map();
  const step = Math.max(1, Math.floor(Math.sqrt(W * H / 40000))) * 4;
  let tot = 0;
  for (let i = 0; i < d.length; i += step * 4) {
    if (d[i + 3] < 8) continue;
    const k = (d[i] << 16) | (d[i + 1] << 8) | d[i + 2];
    gh.set(k, (gh.get(k) || 0) + 1); tot++;
  }
  const seen = new Set(top.map(c => c.hex));
  [...gh.entries()].sort((p, q) => q[1] - p[1]).slice(0, 3).forEach(([k, c]) => {
    const hex = '#' + k.toString(16).padStart(6, '0');
    if (seen.has(hex) || top.length >= 5 || c / Math.max(1, tot) < 0.06) return;
    seen.add(hex);
    top.push({ hex, frac: c / Math.max(1, tot), from: 'area' });
  });

}
/* knock out one or more backdrop colours */
function keyOut(a, hexes, tol) {
  const P0 = pixelsOf(a); if (!P0) return null;
  const im = P0.data, d = im.data;
  const ks = hexes.map(hex2rgb);
  for (let i = 0; i < d.length; i += 4) {
    if (d[i + 3] === 0) continue;
    for (const k of ks) {
      if (Math.abs(d[i] - k[0]) <= tol && Math.abs(d[i + 1] - k[1]) <= tol && Math.abs(d[i + 2] - k[2]) <= tol) {

/* find the animation grid from empty gutters */
function detectGrid(a) {

    if (d[(y * W + x) * 4 + 3] > 8) { col[x]++; row[y]++; }
  }

    let mx = 0; for (const n2 of v) if (n2 > mx) mx = n2;
    const thr = Math.max(1, mx * 0.004);

    for (const val of v) { const e = val <= thr; if (prev && !e) n2++; prev = e; }

/* ── keyframes ─────────────────────────────────────────────
   Any numeric field on a layer / grade / camera can carry a track

/* ── units, slots and actions ───────────────────────────

function newAction(assetId, over) {

    pivotX: null, pivotY: null,  // null => bottom-centre of the frame

  const amp = pv(L, 'amp', t), freq = pv(L, 'freq', t), spd = pv(L, 'speed', t);
  const band = Math.max(1, Math.round(pv(L, 'band', t)));
  if (amp <= 0) return;

  mkA.width = x1 - x0; mkA.height = y1 - y0;
  mkACtx.clearRect(0, 0, mkA.width, mkA.height);
  mkACtx.imageSmoothingEnabled = false;
  mkACtx.drawImage(ctx.canvas, x0, y0, mkA.width, mkA.height, 0, 0, mkA.width, mkA.height);

  ctx.save();
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(x0, y0, mkA.width, mkA.height);
  const cx = mkA.width / 2, cy = mkA.height / 2;
  const maxR = Math.hypot(cx, cy) || 1;
  if (L.fxMode === 'ripple') {
    for (let ry = 0; ry < mkA.height; ry += band) {
      for (let rx = 0; rx < mkA.width; rx += band) {
        const ddx = rx - cx, ddy = ry - cy;
        const r = Math.hypot(ddx, ddy) || 1;
        const fall = L.falloff > 0 ? Math.max(0, 1 - r / maxR) : 1;
        const push = Math.sin(r / Math.max(1, freq) - t * spd * TAU) * amp * fall;
        ctx.drawImage(mkA, rx, ry, band, band,
          x0 + rx + (ddx / r) * push, y0 + ry + (ddy / r) * push, band, band);
      }
    }
  } else {
    for (let ry = 0; ry < mkA.height; ry += band) {
      let off;
      if (L.fxMode === 'warp') {
        const cyc = Math.sin((ry / Math.max(1, freq) + t * spd) * TAU);
        off = (cyc > .82 ? amp : cyc < -.82 ? -amp : 0);
      } else {
        const fall = L.falloff > 0 ? (1 - ry / mkA.height) : 1;
        off = Math.sin((ry / Math.max(1, freq)) + t * spd * TAU) * amp * fall;
      }
      ctx.drawImage(mkA, 0, ry, mkA.width, band, x0 + off, y0 + ry, mkA.width, band);
    }
  }
  ctx.restore();
  if (recording) hits.push({ L, x: X, y: Y, w: dw, h: dh });
}

/* ── 9-slice panels (§19) ───────────────────────────────
   Corners keep their size, edges stretch or tile, the middle
   fills. Lets a dialogue box fit two lines or six without
   distorting the artwork. */
function drawPanel(ctx, L, t, camX, camY, W, H) {
  const a = resolveAsset(L); if (!a) return;
  const img = sourceFor(a, L, t);
  const sc = (pv(L, 'scale', t) || 1) * groupScale(L, t);
  const l = Math.max(0, L.insL | 0), r = Math.max(0, L.insR | 0);
  const tp = Math.max(0, L.insT | 0), b = Math.max(0, L.insB | 0);
  if (l + r >= a.w || tp + b >= a.h) return;

  const dw = Math.max((l + r) * sc + 1, pv(L, 'boxW', t) || 1);
  const dh = Math.max((tp + b) * sc + 1, pv(L, 'boxH', t) || 1);
  const { bx, by } = place(L, t, dw, dh, H, camX, camY);
  const X = Math.round(bx), Y = Math.round(by);

  const sxs = [0, l, a.w - r], sws = [l, a.w - l - r, r];
  const sys = [0, tp, a.h - b], shs = [tp, a.h - tp - b, b];
  const dxs = [0, l * sc, dw - r * sc], dws = [l * sc, dw - (l + r) * sc, r * sc];
  const dys = [0, tp * sc, dh - b * sc], dhs = [tp * sc, dh - (tp + b) * sc, b * sc];

  ctx.filter = layerFilter(L, t);
  ctx.imageSmoothingEnabled = false;
  const tile = L.edgeMode === 'tile';
  for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) {
    if (sws[j] <= 0 || shs[i] <= 0 || dws[j] <= 0 || dhs[i] <= 0) continue;
    const corner = (i !== 1 && j !== 1);
    if (!tile || corner) {
      ctx.drawImage(img, sxs[j], sys[i], sws[j], shs[i],
        Math.round(X + dxs[j]), Math.round(Y + dys[i]), Math.ceil(dws[j]), Math.ceil(dhs[i]));
    } else {
      const stepX = sws[j] * sc, stepY = shs[i] * sc;
      for (let y = 0; y < dhs[i]; y += stepY) {
        for (let x = 0; x < dws[j]; x += stepX) {
          const cw = Math.min(stepX, dws[j] - x), ch = Math.min(stepY, dhs[i] - y);
          ctx.drawImage(img, sxs[j], sys[i], sws[j] * (cw / stepX), shs[i] * (ch / stepY),
            Math.round(X + dxs[j] + x), Math.round(Y + dys[i] + y), Math.ceil(cw), Math.ceil(ch));
        }
      }
    }
  }
  ctx.filter = 'none';
  if (recording) hits.push({ L, x: X, y: Y, w: dw, h: dh });
}

/* ── layer drawing ─────────────────────────────────────── */
let recording = false;
let placements = {};   // attach-point positions published this frame
function drawLayer(ctx, L, t, camX, camY, W, H, freeze, forced) {
  if (!L.visible && !forced) return;
  if (soloId && !forced && L.id !== soloId) return;
  if (L.maskSource && !forced) return;          // mask-only layers never draw themselves
  // §15.1 selective hit stop. `freeze` is how far real time has run past
  // content time inside a stop; a layer rejoins it in proportion to stopScale.
  if (freeze > 0 && L.stopScale) t += freeze * L.stopScale;
  const op = pv(L, 'opacity', t) * (forced ? 1 : groupAlpha(L, t));
  if (op <= 0) return;

  // §21 masks — render this layer offscreen, keep only where the mask has alpha
  if (L.maskLayer && !forced && curShot) {
    const m = curShot.layers.find(x => x.id === L.maskLayer);
    if (m && m !== L) {
      mkA.width = W; mkA.height = H; mkB.width = W; mkB.height = H;
      mkACtx.clearRect(0, 0, W, H); mkBCtx.clearRect(0, 0, W, H);
      drawLayer(mkACtx, L, t, camX, camY, W, H, freeze, true);
      drawLayer(mkBCtx, m, t, camX, camY, W, H, freeze, true);
      mkACtx.save();
      mkACtx.globalCompositeOperation = L.maskInvert ? 'destination-out' : 'destination-in';
      mkACtx.drawImage(mkB, 0, 0);
      mkACtx.restore();
      ctx.save();
      ctx.globalAlpha = op;
      ctx.globalCompositeOperation = L.blend || 'source-over';
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(mkA, 0, 0);
      ctx.restore();
      return;
    }
  }
  ctx.save();
  ctx.globalAlpha = op;
  ctx.globalCompositeOperation = L.blend || 'source-over';

  if (L.kind === 'solid') {
    ctx.fillStyle = L.color; ctx.fillRect(0, 0, W, H);
    if (recording) hits.push({ L, x: 0, y: 0, w: W, h: H });
    ctx.restore(); return;
  }
  if (L.kind === 'text') { drawTextLayer(ctx, L, t, camX, camY, W, H); ctx.restore(); return; }
  if (L.kind === 'panel') { drawPanel(ctx, L, t, camX, camY, W, H); ctx.restore(); return; }
  if (L.kind === 'distort') { drawDistort(ctx, L, t, camX, camY, W, H); ctx.restore(); return; }

  const a = resolveAsset(L);
  if (!a) { ctx.restore(); return; }

  let sx = 0, sy = 0, sw = a.w, sh = a.h;
  const FI = frameInfo(L);
  if (L.kind === 'anim') {
    const fw = FI.fw, fh = FI.fh;
    const cols = Math.max(1, Math.floor(a.w / fw)), rows = Math.max(1, Math.floor(a.h / fh));
    const avail = Math.max(1, cols * rows - (L.startFrame | 0));
    const total = Math.max(1, FI.count > 0 ? Math.min(FI.count, avail) : avail);
    const lt = t - L.delay;
    if (lt < 0 && L.hideBefore) { ctx.restore(); return; }
    const raw = Math.floor(Math.max(0, lt) * FI.fps);
    let f;
    if (L.pingpong && total > 1) { const per = total * 2 - 2; const k = ((raw % per) + per) % per; f = k < total ? k : per - k; }
    else if (L.loop) f = ((raw % total) + total) % total;
    else f = Math.min(raw, total - 1);
    if (!L.loop && !L.pingpong && !L.holdLast && raw >= total) { ctx.restore(); return; }
    f += (L.startFrame | 0);
    sx = (f % cols) * fw; sy = Math.floor(f / cols) * fh; sw = fw; sh = fh;
  }

  const src = sourceFor(a, L, t);
  const scl = pv(L, 'scale', t) * groupScale(L, t);
  const dw = Math.max(1, sw * scl), dh = Math.max(1, sh * scl);
  ctx.filter = layerFilter(L, t);
  ctx.imageSmoothingEnabled = false;

  let { bx, by } = place(L, t, dw, dh, H, camX, camY);
  // pivot: the frame point that should land where bottom-centre would.
  // Keeps a unit from jumping when its action swaps to a different frame box.
  if (L.kind === 'anim' && (FI.pivotX != null || FI.pivotY != null || FI.ground)) {
    const pxv = FI.pivotX == null ? sw / 2 : FI.pivotX;
    const pyv = FI.pivotY == null ? sh : FI.pivotY;
    bx += dw / 2 - pxv * scl;
    by += dh - pyv * scl + (FI.ground || 0) * scl;
  }
  // §18 attach points — ride a named point on another layer's sprite
  if (L.attach && placements[L.attach]) {
    const t2 = placements[L.attach];
    bx = t2.x + pv(L, 'x', t) ;
    by = t2.y + pv(L, 'y', t);
    if (L.kind !== 'text') { bx -= dw / 2; by -= dh / 2; }
  }
  if (L.attachName && L.slot === null) { /* reserved */ }
  // publish this layer's own attach points for others to ride
  if (FI.attach) for (const k in FI.attach) {
    const ap = FI.attach[k];
    placements[L.id + '@' + k] = {
      x: bx + (L.flipH ? dw - ap.x * scl : ap.x * scl),
      y: by + ap.y * scl
    };
    if (L.slot) placements[L.slot + '.' + (L.action || 'idle') + '@' + k] = placements[L.id + '@' + k];
  }
  if (recording) hits.push({ L, x: bx, y: by, w: L.tileX ? W : dw, h: L.tileY ? H : dh, tiled: L.tileX || L.tileY });

  const put1 = (px, py, alpha) => {
    ctx.save();
    if (alpha != null) ctx.globalAlpha = op * alpha;
    ctx.translate(px + (L.flipH ? dw : 0), py + (L.flipV ? dh : 0));
    ctx.scale(L.flipH ? -1 : 1, L.flipV ? -1 : 1);
    ctx.drawImage(src, sx, sy, sw, sh, 0, 0, dw, dh);
    ctx.restore();
  };
  // §29 motion blur: sample the layer's own path over the previous frame
  let mbDX = 0, mbDY = 0, mbN = 1;
  if (L.mblur > 0) {
    const dt = 1 / Math.max(1, P.fps);
    const prev = place(L, Math.max(0, t - dt), dw, dh, H, camX, camY);
    mbDX = (bx - prev.bx) * L.mblur;
    mbDY = (by - prev.by) * L.mblur;
    if (Math.hypot(mbDX, mbDY) < 0.6) { mbDX = mbDY = 0; }
    else mbN = Math.max(2, Math.min(12, L.mblurSamples | 0 || 5));
  }
  const put = (px, py) => {
    if (mbN < 2) { put1(px, py, null); return; }
    for (let i = 0; i < mbN; i++) {
      const f = i / (mbN - 1) - 1;       // -1 (a frame ago) .. 0 (now)
      put1(px + mbDX * f, py + mbDY * f, 1 / mbN);
    }
  };

  const xs = [], ys = [];
  if (L.tileX) { const x0 = ((bx % dw) + dw) % dw - dw; for (let x = x0; x < W; x += dw) xs.push(x); }
  else xs.push(bx);
  if (L.tileY) { const y0 = ((by % dh) + dh) % dh - dh; for (let y = y0; y < H; y += dh) ys.push(y); }
  else ys.push(by);
  for (const x of xs) for (const y of ys) put(Math.round(x), Math.round(y));

  ctx.restore();
}

/* ── shot render → buffer ──────────────────────────────── */
function renderShot(ctx, sIdx, t, W, H, rec, freeze) {
  const S = P.shots[sIdx]; if (!S) return;
  recording = !!rec; if (recording) hits = [];
  placements = {};
  curShot = S;
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';
  ctx.fillStyle = S.bg; ctx.fillRect(0, 0, W, H);

  const p = S.dur > 0 ? clamp(t / S.dur, 0, 1) : 0, e = ease(p, S.cam.ease);
  let camX = -pv(S.cam, 'panX', t) * e, camY = -pv(S.cam, 'panY', t) * e;
  // §22 follow: keep a layer at a chosen screen fraction
  if (S.cam.follow) {
    const tgt = S.layers.find(l => l.id === S.cam.follow);
    if (tgt) {
      const c = layerCentre(tgt, t, W, H);
      if (c) {
        const amt = pv(S.cam, 'followAmt', t);
        camX += (W * S.cam.followX - c.x) * amt;
        camY += (H * S.cam.followY - c.y) * amt;
      }
    }
  }

  // back → front (array is stored front-first)
  for (let i = S.layers.length - 1; i >= 0; i--) drawLayer(ctx, S.layers[i], t, camX, camY, W, H, freeze || 0);
  ctx.restore(); recording = false;
}

/* ── post grade + effects, buffer → target ─────────────── */
function composite(dst, src, S, t, W, H) {
  const F = S.fx, C = S.cam;
  const p = S.dur > 0 ? clamp(t / S.dur, 0, 1) : 0, e = ease(p, C.ease);
  const zoom = pv(C, 'zoom0', t) + (pv(C, 'zoom1', t) - pv(C, 'zoom0', t)) * e;
  const shk = pv(C, 'shake', t);
  let shx = 0, shy = 0;
  if (shk > 0) {
    const dec = C.shakeDecay ? (1 - p) : 1;
    shx = Math.sin(t * C.shakeFreq * 1.0) * shk * dec;
    shy = Math.cos(t * C.shakeFreq * 1.37 + 1.1) * shk * dec;
  }
  camView = { zoom, shx, shy };
  dst.save(); dst.setTransform(1, 0, 0, 1, 0, 0);
  dst.globalAlpha = 1; dst.globalCompositeOperation = 'source-over';
  dst.fillStyle = S.bg; dst.fillRect(0, 0, W, H);
  dst.imageSmoothingEnabled = false;

  const fl = [];
  const fb = pv(F,'bright',t), fc = pv(F,'contrast',t), fs = pv(F,'sat',t), fh = pv(F,'hue',t);
  if (fb !== 1) fl.push(`brightness(${fb})`);
  if (fc !== 1) fl.push(`contrast(${fc})`);
  if (fs !== 1) fl.push(`saturate(${fs})`);
  if (fh) fl.push(`hue-rotate(${fh}deg)`);
  dst.filter = fl.length ? fl.join(' ') : 'none';

  const dw = W * zoom, dh = H * zoom;
  const dx = Math.round((W - dw) / 2 + shx), dy = Math.round((H - dh) / 2 + shy);

  const fchr = pv(F,'chroma',t);
  if (fchr > 0) {
    const o = fchr;
    dst.globalCompositeOperation = 'lighter';
    dst.globalAlpha = .55;
    dst.drawImage(src, dx - o, dy, dw, dh);
    dst.drawImage(src, dx + o, dy, dw, dh);
    dst.globalAlpha = 1; dst.globalCompositeOperation = 'source-over';
  }
  dst.drawImage(src, dx, dy, dw, dh);
  dst.filter = 'none';

  // colour wash
  const fta = pv(F,'tintAmt',t);
  if (fta > 0) {
    dst.globalCompositeOperation = 'overlay'; dst.globalAlpha = fta;
    dst.fillStyle = F.tint; dst.fillRect(0, 0, W, H);
    dst.globalCompositeOperation = 'source-over'; dst.globalAlpha = 1;
  }
  // vignette
  const fvg = pv(F,'vignette',t);
  if (fvg > 0) {
    const g = dst.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .25, W / 2, H / 2, Math.max(W, H) * .72);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${fvg})`);
    dst.fillStyle = g; dst.fillRect(0, 0, W, H);
  }
  // scanlines
  const fsc = pv(F,'scan',t);
  if (fsc > 0) {
    dst.globalAlpha = fsc; dst.fillStyle = '#000';
    for (let y = 0; y < H; y += 2) dst.fillRect(0, y, W, 1);
    dst.globalAlpha = 1;
  }
  // grain
  const fgr = pv(F,'grain',t);
  if (fgr > 0) {
    makeGrain(W, H);
    const idx = Math.floor(t * 14) % grainTiles.length;
    dst.globalAlpha = fgr; dst.globalCompositeOperation = 'overlay';
    dst.drawImage(grainTiles[idx], 0, 0);
    dst.globalCompositeOperation = 'source-over'; dst.globalAlpha = 1;
  }
  // flash (fires at t=0 of the shot)
  const ffl = pv(F,'flash',t);
  if (ffl > 0 && t < F.flashDur) {
    dst.globalAlpha = ffl * (1 - t / F.flashDur);
    dst.fillStyle = F.flashColor; dst.fillRect(0, 0, W, H); dst.globalAlpha = 1;
  }
  // letterbox
  const fbr = pv(F,'bars',t);
  if (fbr > 0) {
    const bh = Math.round(H * fbr * .5);
    dst.fillStyle = '#000'; dst.fillRect(0, 0, W, bh); dst.fillRect(0, H - bh, W, bh);
  }
  dst.restore();
}

/* ── transitions ───────────────────────────────────────── */
function applyTransition(dst, prev, S, t, W, H) {
  const T = S.tin; if (!T || T.type === 'cut' || T.dur <= 0 || t >= T.dur) return;
  const p = clamp(t / T.dur, 0, 1);
  dst.save(); dst.setTransform(1, 0, 0, 1, 0, 0); dst.imageSmoothingEnabled = false;
  scB.width = W; scB.height = H;
  bCtx.clearRect(0, 0, W, H); bCtx.drawImage(dst.canvas, 0, 0);
  const cur = scB;
  const has = !!prev;

  const wipe = (dir) => {
    if (has) dst.drawImage(prev, 0, 0);
    dst.save(); dst.beginPath();
    if (dir === 'l') dst.rect(0, 0, W * p, H);
    else if (dir === 'r') dst.rect(W - W * p, 0, W * p, H);
    else if (dir === 'u') dst.rect(0, 0, W, H * p);
    else dst.rect(0, H - H * p, W, H * p);
    dst.clip(); dst.drawImage(cur, 0, 0); dst.restore();
  };

  switch (T.type) {
    case 'fade': {
      const a = p < .5 ? p * 2 : (1 - p) * 2;
      dst.drawImage(p < .5 && has ? prev : cur, 0, 0);
      dst.globalAlpha = a; dst.fillStyle = T.color; dst.fillRect(0, 0, W, H); dst.globalAlpha = 1;
      break;
    }
    case 'crossfade':
      dst.drawImage(cur, 0, 0);
      if (has) { dst.globalAlpha = 1 - p; dst.drawImage(prev, 0, 0); dst.globalAlpha = 1; }
      break;
    case 'flash':
      dst.drawImage(p < .5 && has ? prev : cur, 0, 0);
      dst.globalAlpha = p < .5 ? p * 2 : (1 - p) * 2;
      dst.fillStyle = T.color === '#000000' ? '#ffffff' : T.color;
      dst.fillRect(0, 0, W, H); dst.globalAlpha = 1;
      break;
    case 'wipeL': wipe('l'); break;
    case 'wipeR': wipe('r'); break;
    case 'wipeU': wipe('u'); break;
    case 'wipeD': wipe('d'); break;
    case 'slideL':
      if (has) dst.drawImage(prev, -W * p, 0);
      else { dst.fillStyle = T.color; dst.fillRect(0, 0, W, H); }
      dst.drawImage(cur, W - W * p, 0); break;
    case 'slideR':
      if (has) dst.drawImage(prev, W * p, 0);
      else { dst.fillStyle = T.color; dst.fillRect(0, 0, W, H); }
      dst.drawImage(cur, -W + W * p, 0); break;
    case 'slideU':
      if (has) dst.drawImage(prev, 0, -H * p);
      else { dst.fillStyle = T.color; dst.fillRect(0, 0, W, H); }
      dst.drawImage(cur, 0, H - H * p); break;
    case 'iris': {
      if (has) dst.drawImage(prev, 0, 0); else { dst.fillStyle = T.color; dst.fillRect(0, 0, W, H); }
      dst.save(); dst.beginPath();
      dst.arc(W / 2, H / 2, Math.hypot(W, H) * .55 * p, 0, TAU); dst.clip();
      dst.drawImage(cur, 0, 0); dst.restore(); break;
    }
    case 'dissolve': {
      const cs = 4, cols = Math.ceil(W / cs), rows = Math.ceil(H / cs);
      const ord = dissolveOrder(cols, rows), n = Math.floor(ord.length * p);
      if (has) dst.drawImage(prev, 0, 0); else { dst.fillStyle = T.color; dst.fillRect(0, 0, W, H); }
      dst.save(); dst.beginPath();
      for (let i = 0; i < n; i++) { const c = ord[i]; dst.rect((c % cols) * cs, Math.floor(c / cols) * cs, cs, cs); }
      dst.clip(); dst.drawImage(cur, 0, 0); dst.restore(); break;
    }
  }
  dst.restore();
}

/* ── frame render (used by preview AND export) ─────────── */
function renderFrame(dst, t, W, H, rec) {
  const { i, local: realLocal } = shotAt(t);
  const S = P.shots[i]; if (!S) return;
  const local = warp(S, realLocal);
  const freeze = realLocal - local;          // > 0 only inside a hit stop
  buf.width = W; buf.height = H;
  renderShot(bctx, i, local, W, H, rec && i === sel.shot, freeze);
  composite(dst, buf, S, local, W, H);

  const T = S.tin;
  if (T && T.type !== 'cut' && T.dur > 0 && realLocal < T.dur) {
    let prev = null;
    const pi = soloShot ? -1 : prevInOrder(i);
    if (pi >= 0) {
      const pS = P.shots[pi];
      snap.width = W; snap.height = H;
      scA.width = W; scA.height = H;
      aCtx.clearRect(0, 0, W, H);
      renderShot(aCtx, pi, pS.dur, W, H, false);
      composite(nctx, scA, pS, pS.dur, W, H);
      prev = snap;
    }
    applyTransition(dst, prev, S, realLocal, W, H);
  }
}

/* ── preview loop ──────────────────────────────────────── */
function req() { dirty = true; }
function loop(ts) {
  const dt = Math.min(.1, (ts - lastT) / 1000 || 0); lastT = ts;
  if (playing && !exporting) {
    time += dt;
    const T = totalTime();
    if (loopA != null && loopB != null && loopB > loopA) {
      if (time >= loopB) { time = loopA; resetAudio(); }
    } else if (time >= T) {
      if ($('#cLoop').checked) time = 0; else { time = T; setPlaying(false); }
    }
    if (!soloShot) { const s = shotAt(time).i; if (s !== sel.shot) { sel.shot = s; sel.layer = 0; resetAudio(); drawShots(); drawLayers(); drawInsp(); } }
    const at = shotAt(time);
    fireAudio(at.i, warp(P.shots[at.i], at.local));

function paint() {

  renderFrame(sctx, time, W, H, true);
  drawGuides();
  drawOnion();
  drawSheetGrid();
  updateTransport();
  if (Math.abs(time - lastSyncT) > 1e-4) {

    drawKeys(); drawGraph();
  }
}
let showGuides = false;
function drawGuides() {
  gctx.clearRect(0, 0, P.w, P.h);
  if (!showGuides) return;
  gctx.save();
  gctx.strokeStyle = 'rgba(62,224,216,.35)'; gctx.lineWidth = 1;
  gctx.beginPath();
  for (let i = 1; i < 3; i++) {
    gctx.moveTo(Math.round(P.w * i / 3) + .5, 0); gctx.lineTo(Math.round(P.w * i / 3) + .5, P.h);
    gctx.moveTo(0, Math.round(P.h * i / 3) + .5); gctx.lineTo(P.w, Math.round(P.h * i / 3) + .5);
  }
  gctx.stroke();
  gctx.strokeStyle = 'rgba(255,79,163,.4)';
  gctx.strokeRect(P.w * .05 + .5, P.h * .05 + .5, P.w * .9, P.h * .9);
  gctx.restore();
}
/* §23 onion skin — ghost the selected layer at its neighbouring keys */
let onionOn = false;
function drawOnion() {
  if (!onionOn) return;
  const S = P.shots[sel.shot]; const L = S && S.layers[sel.layer];
  if (!L || !L.k) return;
  const times = new Set();
  for (const k in L.k) L.k[k].forEach(key => times.add(+key.t.toFixed(3)));
  const now = curLocal();
  const all = [...times].sort((a, b) => a - b);
  const prev = all.filter(x => x < now - 1e-4).pop();
  const next = all.find(x => x > now + 1e-4);
  const ghosts = [[prev, 'rgba(255,79,163,'], [next, 'rgba(62,224,216,']];
  mkB.width = P.w; mkB.height = P.h;
  for (const [gt, col] of ghosts) {
    if (gt == null) continue;
    mkBCtx.clearRect(0, 0, P.w, P.h);
    const e2 = ease(S.dur > 0 ? clamp(gt / S.dur, 0, 1) : 0, S.cam.ease);
    drawLayer(mkBCtx, L, gt, -pv(S.cam, 'panX', gt) * e2, -pv(S.cam, 'panY', gt) * e2,
      P.w, P.h, 0, true);
    gctx.save();
    gctx.globalAlpha = .33;
    gctx.drawImage(mkB, 0, 0);
    gctx.globalCompositeOperation = 'source-atop';
    gctx.fillStyle = col + '.5)';
    gctx.fillRect(0, 0, P.w, P.h);
    gctx.restore();
  }
}

/* slice preview for the selected sprite-sheet layer */
function drawSheetGrid() {
  const S = P.shots[sel.shot]; const L = S && S.layers[sel.layer];
  if (!L || L.kind !== 'anim' || !L.showGrid) return;
  const a = resolveAsset(L); if (!a) return;
  const t = curLocal(), sc = pv(L, 'scale', t);
  const FI = frameInfo(L);
  const cols = Math.max(1, Math.floor(a.w / FI.fw));
  const rows = Math.max(1, Math.floor(a.h / FI.fh));
  const dw = FI.fw * sc, dh = FI.fh * sc;
  const { bx, by } = place(L, t, dw, dh, P.h, 0, 0);
  gctx.save();
  gctx.strokeStyle = 'rgba(62,224,216,.75)'; gctx.lineWidth = 1;
  gctx.strokeRect(Math.round(bx) + .5, Math.round(by) + .5, Math.round(dw), Math.round(dh));
  gctx.fillStyle = 'rgba(62,224,216,.9)';
  gctx.font = '7px monospace';
  gctx.fillText(cols + '×' + rows + '  ' + FI.fw + '×' + FI.fh + (FI.fromUnit ? '  (unit)' : ''), Math.round(bx) + 2, Math.round(by) - 2);
  gctx.restore();
}

function buildTimeline() {

/* ── §28 graph editor ───────────────────────────────────
   Every track in the shot as a value curve. Each is normalized
   to its own range, so tracks with wildly different units still
   read together. Drag a point to retime or revalue it. */
let graphOn = false;
const TRACK_COLS = ['#3ee0d8', '#ff4fa3', '#ffc85c', '#9a6bff', '#7dffc8', '#6b8bff', '#ff8f5c'];
function graphTracks() {
  const S = P.shots[sel.shot]; if (!S) return [];
  const out = [];
  const L = S.layers[sel.layer];
  if (L && L.k) for (const k in L.k) out.push({ o: L, k, label: k, src: L.name });
  if (S.fx.k) for (const k in S.fx.k) out.push({ o: S.fx, k, label: 'fx.' + k, src: 'grade' });
  if (S.cam.k) for (const k in S.cam.k) out.push({ o: S.cam, k, label: 'cam.' + k, src: 'camera' });
  (S.groups || []).forEach(G => {
    if (G.k) for (const k in G.k) out.push({ o: G, k, label: G.name + '.' + k, src: 'group' });
  });
  return out;
}
function drawGraph() {
  if (!graphOn) return;
  const wrap = $('#graphWrap'), cv = $('#graph'), kw = $('#graphKeys');
  const S = P.shots[sel.shot]; if (!S) return;
  const W = wrap.clientWidth, H = wrap.clientHeight;
  if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }
  const x = cv.getContext('2d');
  x.clearRect(0, 0, W, H);
  x.fillStyle = '#0a0d1c'; x.fillRect(0, 0, W, H);
  const PADT = 16, PADB = 12;
  const D = Math.max(.001, S.dur);
  const tx = t => (t / D) * W;
  const gy = v => PADT + (1 - v) * (H - PADT - PADB);

  x.strokeStyle = '#1a2040'; x.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const yy = Math.round(gy(i / 4)) + .5;
    x.beginPath(); x.moveTo(0, yy); x.lineTo(W, yy); x.stroke();
  }
  (S.markers || []).forEach(mk => {
    const px = Math.round(tx(mk.t)) + .5;
    x.strokeStyle = 'rgba(255,200,92,.5)';
    x.beginPath(); x.moveTo(px, 0); x.lineTo(px, H); x.stroke();
  });

  const tr = graphTracks();
  [...kw.children].forEach(c => c.remove());
  let leg = document.getElementById('graphLeg');
  if (!leg) { leg = el('div'); leg.id = 'graphLeg'; wrap.appendChild(leg); }
  leg.innerHTML = '';

  tr.forEach((T, ti) => {
    const col = TRACK_COLS[ti % TRACK_COLS.length];
    const keys = T.o.k[T.k];
    let lo = Infinity, hi = -Infinity;
    keys.forEach(kk => { lo = Math.min(lo, kk.v); hi = Math.max(hi, kk.v); });
    if (!isFinite(lo)) return;
    if (hi - lo < 1e-9) { lo -= .5; hi += .5; }
    const pad = (hi - lo) * .12; lo -= pad; hi += pad;
    const nv = v => (v - lo) / (hi - lo);

    x.strokeStyle = col; x.lineWidth = 1.5; x.globalAlpha = .95;
    x.beginPath();
    const N = Math.max(40, Math.min(240, Math.round(W / 3)));
    for (let i = 0; i <= N; i++) {
      const t = (i / N) * D, v = nv(pv(T.o, T.k, t));
      const px = tx(t), py = gy(clamp(v, -.15, 1.15));
      i ? x.lineTo(px, py) : x.moveTo(px, py);
    }
    x.stroke(); x.globalAlpha = 1;

    const sp = el('span');
    sp.innerHTML = `<i style="background:${col}"></i>${esc(T.label)}`;
    sp.style.color = col; leg.appendChild(sp);

    keys.forEach(key => {
      const d = el('div', 'gk');
      d.style.background = col; d.style.color = col;
      d.style.left = tx(key.t) + 'px';
      d.style.top = gy(clamp(nv(key.v), -.15, 1.15)) + 'px';
      d.title = `${T.label} = ${round(key.v)} @ ${key.t.toFixed(2)}s`;
      d.ondblclick = e2 => { e2.stopPropagation(); curveModal(T.o, key, T.label); };
      d.oncontextmenu = e2 => {
        e2.preventDefault(); e2.stopPropagation();
        delKey(T.o, T.k, key.t); push(); drawKeys(); drawGraph(); drawInsp(); req();
      };
      d.onpointerdown = e2 => {
        e2.preventDefault(); e2.stopPropagation();
        const r = wrap.getBoundingClientRect();
        const mv = ev => {
          let t = clamp((ev.clientX - r.left) / r.width, 0, 1) * D;
          if (!ev.altKey) {
            const tol = (7 / r.width) * D;
            for (const mk of (S.markers || [])) if (Math.abs(mk.t - t) < tol) t = mk.t;
          }
          key.t = +t.toFixed(3);
          if (!ev.shiftKey) {
            const fy = 1 - (ev.clientY - r.top - PADT) / (H - PADT - PADB);
            key.v = +(lo + clamp(fy, -.15, 1.15) * (hi - lo)).toFixed(3);
          }
          T.o.k[T.k].sort((a, b) => a.t - b.t);
          drawGraph(); req();
          for (const f of inspSync) f();
        };
        const up = () => {
          window.removeEventListener('pointermove', mv);
          window.removeEventListener('pointerup', up);
          push(); drawKeys();
        };
        window.addEventListener('pointermove', mv); window.addEventListener('pointerup', up);
      };
      kw.appendChild(d);
    });
  });

  if (!tr.length) {
    x.fillStyle = '#6d78a8'; x.font = '10px monospace';
    x.fillText('no tracks in this shot — key a value with the ◈ beside any slider', 10, H / 2);
  }
  const px = Math.round(tx(curLocal())) + .5;
  x.strokeStyle = '#ff4fa3'; x.lineWidth = 1;
  x.beginPath(); x.moveTo(px, 0); x.lineTo(px, H); x.stroke();
}
$('#graphWrap').onpointerdown = e => {
  const S = P.shots[sel.shot]; if (!S) return;
  const r = $('#graphWrap').getBoundingClientRect();
  seekContent(clamp((e.clientX - r.left) / r.width, 0, 1) * S.dur);

/* ── curve editor ───────────────────────────────────────
   Drag two handles; the segment leaving this key follows them.
   Handles may overshoot 0..1 vertically for back/anticipate. */
function curveModal(o, key, label) {
  const c0 = key.c ? key.c.slice() : (CURVES[key.e] || CURVES.linear).slice();
  modal(`<h3>Curve — ${esc(label)} @ ${key.t.toFixed(2)}s</h3>
    <p>The segment leaving this key. Drag the handles; pull past the top or bottom
    for overshoot.</p>
    <canvas id="cvEd" width="300" height="300" style="width:100%;max-width:300px;
      background:var(--ink);border:1px solid var(--line2);border-radius:3px;cursor:crosshair;
      image-rendering:auto;display:block;margin:0 auto"></canvas>
    <div class="keysw" id="cvPre"></div>
    <p id="cvTxt" style="color:var(--cyan);font-size:10px"></p>
    <div class="mrow"><button id="cvClear">Use named easing</button>
      <button id="cvOk" class="p">Apply</button></div>`, box => {
    const cv = box.querySelector('#cvEd'), x = cv.getContext('2d');
    const S0 = 300, PAD = 40, SZ = S0 - PAD * 2;
    const toPx = (px, py) => [PAD + px * SZ, S0 - PAD - py * SZ];
    const toN = (mx, my) => [(mx - PAD) / SZ, (S0 - PAD - my) / SZ];
    let cur = c0.slice(), drag = -1;
    const draw = () => {
      x.clearRect(0, 0, S0, S0);
      x.fillStyle = '#0a0d1c'; x.fillRect(0, 0, S0, S0);
      x.strokeStyle = '#232a4d'; x.lineWidth = 1;
      for (let i = 0; i <= 4; i++) {
        const g = PAD + (i / 4) * SZ;
        x.beginPath(); x.moveTo(PAD, g); x.lineTo(PAD + SZ, g);
        x.moveTo(g, PAD); x.lineTo(g, PAD + SZ); x.stroke();
      }
      x.strokeStyle = '#2f3862'; x.setLineDash([3, 3]);
      x.beginPath(); const [ax, ay] = toPx(0, 0), [bx2, by2] = toPx(1, 1);
      x.moveTo(ax, ay); x.lineTo(bx2, by2); x.stroke(); x.setLineDash([]);
      const [h1x, h1y] = toPx(cur[0], cur[1]), [h2x, h2y] = toPx(cur[2], cur[3]);
      x.strokeStyle = '#6d78a8'; x.beginPath();
      x.moveTo(ax, ay); x.lineTo(h1x, h1y); x.moveTo(bx2, by2); x.lineTo(h2x, h2y); x.stroke();
      x.strokeStyle = '#3ee0d8'; x.lineWidth = 2; x.beginPath(); x.moveTo(ax, ay);
      x.bezierCurveTo(h1x, h1y, h2x, h2y, bx2, by2); x.stroke();
      [[h1x, h1y, '#ff4fa3'], [h2x, h2y, '#ffc85c']].forEach(([hx, hy, col]) => {
        x.fillStyle = col; x.beginPath(); x.arc(hx, hy, 6, 0, TAU); x.fill();
      });
      box.querySelector('#cvTxt').textContent =
        `cubic-bezier(${cur.map(v => v.toFixed(2)).join(', ')})`;
    };
    const at = e => {
      const r = cv.getBoundingClientRect();
      return [(e.clientX - r.left) * cv.width / r.width, (e.clientY - r.top) * cv.height / r.height];
    };
    cv.onpointerdown = e => {
      const [mx, my] = at(e);
      const d1 = Math.hypot(...toPx(cur[0], cur[1]).map((v, i) => v - [mx, my][i]));
      const d2 = Math.hypot(...toPx(cur[2], cur[3]).map((v, i) => v - [mx, my][i]));
      drag = d1 < d2 ? 0 : 1;
      cv.setPointerCapture(e.pointerId);
    };
    cv.onpointermove = e => {
      if (drag < 0) return;
      const [nx, ny] = toN(...at(e));
      cur[drag * 2] = clamp(nx, 0, 1);
      cur[drag * 2 + 1] = clamp(ny, -1, 2);
      draw();
    };
    cv.onpointerup = () => { drag = -1; };
    const pw = box.querySelector('#cvPre');
    Object.entries(CURVES).forEach(([nm, v]) => {
      const b = el('button'); b.textContent = nm;
      b.onclick = () => { cur = v.slice(); draw(); };
      pw.appendChild(b);
    });
    box.querySelector('#cvOk').onclick = () => {
      key.c = cur.slice(); push(); closeModal(); drawKeys(); req();
      toast('Curve applied');
    };
    box.querySelector('#cvClear').onclick = () => {
      delete key.c; push(); closeModal(); drawKeys(); req(); toast('Back to named easing');
    };
    draw();
  });
}

/* ── keyframe lane ─────────────────────────────────────── */
function trackList() {
  const S = P.shots[sel.shot]; if (!S) return [];

  if (L && L.k) for (const k in L.k) out.push({ o: L, k, cls: '' });
  if (S.fx.k) for (const k in S.fx.k) out.push({ o: S.fx, k, cls: ' shot' });
  if (S.cam.k) for (const k in S.cam.k) out.push({ o: S.cam, k, cls: ' shot' });
  return out;
}
function drawKeys() {
  const lane = $('#klane'); if (!lane) return;
  [...lane.querySelectorAll('.kd,.stop,.evm,.mkr')].forEach(x => x.remove());
  const S = P.shots[sel.shot]; if (!S) return;
  const D = Math.max(.001, S.dur);
  const tr = trackList();
  $('#klabel').textContent = tr.length
    ? tr.length + ' track' + (tr.length === 1 ? '' : 's')
    : 'no keys — click a ◈ beside any slider';

  (S.stops || []).forEach(st => {
    const d = el('div', 'stop');
    d.style.left = (clamp(st.t / D, 0, 1) * 100) + '%';

    lane.appendChild(d);
  });

  (S.markers || []).forEach(mk => {
    const d = el('div', 'mkr');

  });
  (S.events || []).forEach(ev => {
    const d = el('div', 'evm');
    d.style.left = (clamp(ev.t / D, 0, 1) * 100) + '%';
    d.title = 'event "' + ev.name + '"' + (ev.data ? ' · ' + ev.data : '') + ' @ ' + ev.t.toFixed(2) + 's';
    lane.appendChild(d);
  });

  tr.forEach(({ o, k, cls }) => {
    o.k[k].forEach(key => {
      const d = el('div', 'kd' + cls);
      d.style.left = (clamp(key.t / D, 0, 1) * 100) + '%';
      d.title = k + ' = ' + round(key.v) + ' @ ' + key.t.toFixed(2) + 's'
        + (key.c ? ' · custom curve' : '') + ' · drag to move · double-click for curve · right-click deletes';
      if (key.c) d.style.boxShadow = '0 0 0 1px var(--amber)';
      d.ondblclick = e => { e.stopPropagation(); curveModal(o, key, k); };
      d.oncontextmenu = e => { e.preventDefault(); e.stopPropagation(); delKey(o, k, key.t); push(); drawKeys(); drawInsp(); req(); };
      d.onpointerdown = e => {
        e.stopPropagation(); e.preventDefault();
        const r = lane.getBoundingClientRect();
        const mv = ev => {
          key.t = +clamp((ev.clientX - r.left) / r.width, 0, 1) * D;
          if (!ev.altKey) {                        // snap to markers unless alt is held
            const snapPx = 7, tol = (snapPx / r.width) * D;
            for (const mk of (S.markers || [])) if (Math.abs(mk.t - key.t) < tol) key.t = mk.t;
          }
          key.t = +key.t.toFixed(3);
          o.k[k].sort((a, b) => a.t - b.t);
          d.style.left = (key.t / D * 100) + '%'; req(); drawKeys();
        };
        const up = () => { window.removeEventListener('pointermove', mv); window.removeEventListener('pointerup', up); push(); };
        window.addEventListener('pointermove', mv); window.addEventListener('pointerup', up);
      };
      lane.appendChild(d);
    });
  });
  const S2 = P.shots[sel.shot];
  $('#ph2').style.left = (clamp(curLocal() / Math.max(.001, S2.dur), 0, 1) * 100) + '%';
}
$('#klane').onpointerdown = e => {
  const r = $('#klane').getBoundingClientRect();
  const S = P.shots[sel.shot];
  seekContent(clamp((e.clientX - r.left) / r.width, 0, 1) * S.dur);
};

/* ── direct manipulation on the canvas ─────────────────── */
function stageToProject(clientX, clientY) {
  const r = stage.getBoundingClientRect();
  const mx = (clientX - r.left) / r.width * P.w;
  const my = (clientY - r.top) / r.height * P.h;
  const { zoom, shx, shy } = camView;
  const dx = (P.w - P.w * zoom) / 2 + shx, dy = (P.h - P.h * zoom) / 2 + shy;
  return { x: (mx - dx) / zoom, y: (my - dy) / zoom };
}
function pickLayer(px, py) {
  for (let i = hits.length - 1; i >= 0; i--) {
    const h = hits[i];
    if (px >= h.x && px <= h.x + h.w && py >= h.y && py <= h.y + h.h) return h.L;
  }
  return null;
}
stage.addEventListener('pointerdown', e => {
  if (playing) return;
  const S = P.shots[sel.shot]; if (!S) return;
  const pt = stageToProject(e.clientX, e.clientY);
  const L = pickLayer(pt.x, pt.y);
  if (!L) return;
  const idx = S.layers.indexOf(L);
  if (idx >= 0 && idx !== sel.layer) { sel.layer = idx; drawLayers(); drawInsp(); }
  e.preventDefault(); stage.setPointerCapture(e.pointerId); stage.classList.add('dragging');
  const t = curLocal();
  drag = { L, sx: pt.x, sy: pt.y, ox: pv(L, 'x', t), oy: pv(L, 'y', t), axis: null, moved: false };
});
stage.addEventListener('pointermove', e => {
  if (!drag) return;
  const pt = stageToProject(e.clientX, e.clientY);
  let dx = pt.x - drag.sx, dy = pt.y - drag.sy;
  if (Math.abs(dx) > 1 || Math.abs(dy) > 1) drag.moved = true;
  if (e.shiftKey) { if (Math.abs(dx) > Math.abs(dy)) dy = 0; else dx = 0; }
  const t = curLocal();
  setProp(drag.L, 'x', t, Math.round(drag.ox + dx));
  setProp(drag.L, 'y', t, Math.round(drag.oy + dy));
  for (const f of inspSync) f();
  req();
});
const endDrag = () => {
  if (!drag) return;
  stage.classList.remove('dragging');
  if (drag.moved) { push(); drawKeys(); }
  drag = null;
};
stage.addEventListener('pointerup', endDrag);
stage.addEventListener('pointercancel', endDrag);
stage.addEventListener('wheel', e => {

  const t = curLocal();
  const v = clamp(pv(L, 'scale', t) * (e.deltaY < 0 ? 1.06 : 1 / 1.06), .1, 8);
  setProp(L, 'scale', t, +v.toFixed(3));

/* ── audio ─────────────────────────────────────────────── */
function addAudio(name, src) {
  const id = uid();
  const e2 = new Audio(); e2.src = src; e2.preload = 'auto';
  AU[id] = { id, name, src, el: e2, peaks: null };
  peaksFor(AU[id]);
  return AU[id];
}
/* §31 decode once to a peak envelope for the timeline */
async function peaksFor(au) {
  if (au.peaks || au._decoding) return au.peaks;
  au._decoding = true;
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return null;
    const ac = new Ctx();
    const bytes = await (await fetch(au.src)).arrayBuffer();
    const buf = await ac.decodeAudioData(bytes);
    const ch = buf.getChannelData(0);
    const N = 900, step = Math.max(1, Math.floor(ch.length / N));
    const pk = new Float32Array(N);
    for (let i = 0; i < N; i++) {
      let m = 0;
      const a = i * step, b = Math.min(ch.length, a + step);
      for (let j = a; j < b; j++) { const v = Math.abs(ch[j]); if (v > m) m = v; }
      pk[i] = m;
    }
    au.peaks = pk; au.dur = buf.duration;
    ac.close(); drawWave();
  } catch (e) { au.peaks = null; }
  finally { au._decoding = false; }
  return au.peaks;
}
function drawWave() {
  const cv = document.getElementById('wave');
  if (!cv) return;
  const W = cv.clientWidth, H = cv.clientHeight;
  if (!W) return;
  if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }
  const x = cv.getContext('2d');
  x.clearRect(0, 0, W, H);
  const T = totalTime() || 1;
  let any = false;
  const ord = soloShot ? [sel.shot] : playOrder();
  let acc = 0;
  for (const i of ord) {
    const S = P.shots[i];
    for (const m of (S.audio || [])) {
      const au = AU[m.auId];
      if (!au || !au.peaks) continue;
      any = true;
      const start = acc + unwarp(S, m.t);
      const px0 = (start / T) * W, px1 = ((start + (au.dur || 0)) / T) * W;
      const span = Math.max(1, px1 - px0);
      x.fillStyle = 'rgba(62,224,216,.45)';
      for (let p = 0; p < span; p++) {
        const v = au.peaks[Math.floor(p / span * au.peaks.length)] || 0;
        const h = Math.max(1, v * (H - 2));
        x.fillRect(px0 + p, (H - h) / 2, 1, h);
      }
    }
    acc += shotReal(S);
  }
  cv.style.display = any ? 'block' : 'none';
}
function resetAudio() {
  liveAudio.forEach(a => { try { a.pause(); } catch (x) { } });
  liveAudio = []; audioCursor = { shot: -1, t: -1 };
}
function fireAudio(shotIdx, content) {
  if (exporting) return;
  const S = P.shots[shotIdx]; if (!S) return;
  const from0 = audioCursor.shot === shotIdx ? audioCursor.t : -1;
  (S.events || []).forEach(ev => {
    if (ev.t > from0 && ev.t <= content) toast('▸ ' + ev.name + (ev.data ? ' · ' + ev.data : ''));
  });
  if (!S.audio) { audioCursor = { shot: shotIdx, t: content }; return; }
  if (audioCursor.shot !== shotIdx) { audioCursor = { shot: shotIdx, t: -1 }; }
  const from = audioCursor.t;
  S.audio.forEach(m => {
    if (m.t > from && m.t <= content) {
      const au = AU[m.auId]; if (!au) return;
      const e2 = au.el.cloneNode();
      e2.volume = clamp(m.vol == null ? 1 : m.vol, 0, 1);
      e2.play().catch(() => { });
      liveAudio.push(e2);
      e2.onended = () => { liveAudio = liveAudio.filter(x => x !== e2); };
    }
  });
  audioCursor.t = content;
}

/* ── right: layers ─────────────────────────────────────── */
const depthColor = (p) => p >= 1.3 ? '#ff4fa3' : p >= .9 ? '#3ee0d8' : p >= .5 ? '#9a6bff' : p >= .2 ? '#5a6bb8' : '#39406e';

/* §BD v1.9 — warn when a near-full opaque image sits in front of other images */
function warnDepthOrder(S) {
  if (!S || !S.layers) return null;
  const imgs = S.layers.map((L, i) => ({ L, i })).filter(x => x.L.kind === 'image' && x.L.visible !== false);
  if (imgs.length < 2) return null;
  // Heuristic: if an image layer earlier than the last has scale that fills frame (~asset unknown here),
  // flag any image that is not the rearmost when its name/parallax suggests backdrop OR parallax < 0.2 while index is front.
  const rear = imgs[imgs.length - 1];
  for (const { L, i } of imgs) {
    if (i === rear.i) continue;
    const px = L.parallax == null ? 1 : L.parallax;
    // opaque-looking sky/backdrop wrongly in front: low parallax but not last
    if (px <= 0.2 && i < rear.i) {
      return 'Depth warning: low-parallax plate "' + (L.name || 'layer') + '" is in front of other images. Move full-frame backdrops to the BACK of the stack (front-first list).';
    }
    // high parallax full plate name hints
    const n = String(L.name || '').toLowerCase();
    if ((/cyberpunk_city|bg_\d|layer-\d|md_\d|parallax|enviro/).test(n) && px >= 1.2 && i === 0) {
      return 'Depth warning: "' + L.name + '" looks like a full plate at the FRONT with high parallax — it will hide layers behind it. Put opaque full-frame art at the BACK.';
    }
  }
  return null;
}

function assignAsset(id) {

/* ── background removal ────────────────────────────────── */
function bgModal(id) {
  const a = A[id];
  const info = analyzeBG(a);
  if (!info) return toast('Could not read that image');
  const chosen = new Set();
  info.colors.forEach((c, i) => { if (i === 0 && info.clearFrac < 0.03) chosen.add(c.hex); });
  let tol = 26;

  modal(`<h3>Remove background — ${esc(a.name)}</h3>
    <p>${a.w}×${a.h} · ${(info.clearFrac * 100).toFixed(0)}% already transparent.
    Pick the backdrop colours to knock out. Checkerboards need two, and sheets with
    dark gutters usually need the <i>area</i> colour rather than the edge one.</p>
    <canvas id="bgPrev"></canvas>
    <div class="keysw" id="bgKeys"></div>
    <div class="row"><label>tolerance</label>
      <input type="range" id="bgTol" min="0" max="120" step="1" value="26">
      <input type="number" class="num" id="bgTolN" value="26"></div>
    <p id="bgStat" style="color:var(--cyan)"></p>
    <div class="mrow"><button id="bgApply" class="p">Replace asset</button>
      <button id="bgCopy">Save as copy</button></div>`, box => {

    const prev = box.querySelector('#bgPrev');
    const px = prev.getContext('2d');
    prev.width = a.w; prev.height = a.h;

    const render = () => {
      const keys = [...chosen];
      let out = a.img, cleared = info.clearFrac;
      if (keys.length) {
        const c = keyOut(a, keys, tol);
        if (c) {
          out = c;
          const dd = c.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, a.w, a.h).data;
          let n2 = 0; for (let i = 3; i < dd.length; i += 4) if (dd[i] < 8) n2++;
          cleared = n2 / (a.w * a.h);
        }
      }
      px.clearRect(0, 0, a.w, a.h);
      px.imageSmoothingEnabled = false;
      px.drawImage(out, 0, 0);
      box.querySelector('#bgStat').textContent =
        keys.length ? `${(cleared * 100).toFixed(1)}% transparent after keying` : 'No colour selected — nothing will change.';
      return out;
    };

    const kw = box.querySelector('#bgKeys');
    info.colors.forEach(c => {
      const b = el('button', chosen.has(c.hex) ? 'on' : '');
      b.innerHTML = `<span class="dot" style="background:${c.hex}"></span>${c.hex} · ${(c.frac * 100).toFixed(0)}% ${c.from}`;
      b.onclick = () => {
        chosen.has(c.hex) ? chosen.delete(c.hex) : chosen.add(c.hex);
        b.classList.toggle('on'); render();
      };
      kw.appendChild(b);
    });

    const tr = box.querySelector('#bgTol'), tn = box.querySelector('#bgTolN');
    const setTol = v => { tol = +v; tr.value = v; tn.value = v; render(); };
    tr.oninput = () => setTol(tr.value);
    tn.oninput = () => setTol(tn.value);

    const finish = (replace) => {
      if (!chosen.size) return toast('Select a colour first');
      const out = render();
      const url = out.toDataURL();
      if (replace) {
        addAsset(a.name, url, { gif: a.gif || null }).then(nw => {
          Object.values(A).forEach(() => { });
          P.shots.forEach(sh => sh.layers.forEach(l => { if (l.assetId === id) l.assetId = nw.id; }));
          (P.units || []).forEach(u => Object.values(u.actions).forEach(ac => { if (ac.assetId === id) ac.assetId = nw.id; }));
          delete A[id];
          tintCache.clear(); palCache.clear();
          push(); drawAssets(); drawLayers(); drawInsp(); req(); closeModal();
          toast('Background removed');
        });
      } else {
        addAsset(a.name + '_keyed', url, { gif: a.gif || null }).then(() => {
          push(); drawAssets(); req(); closeModal(); toast('Saved as copy');
        });
      }
    };
    box.querySelector('#bgApply').onclick = () => finish(true);
    box.querySelector('#bgCopy').onclick = () => finish(false);
    render();
  });
}

/* ── inspector control helpers ─────────────────────────── */
function grp(parent, title, open = true) {
  const g = el('div', 'grp' + (open ? '' : ' cl'));
  const t = el('div', 'gt'); t.textContent = title;
  const c = el('div', 'gc');
  t.onclick = () => g.classList.toggle('cl');
  g.append(t, c); parent.appendChild(g); return c;
}
function num(p, label, o, k, min, max, step, cb, kf) {
  const row = el('div', 'row' + (kf ? ' kf' : ''));
  const l = el('label'); l.textContent = label;
  const r = el('input'); r.type = 'range'; r.min = min; r.max = max; r.step = step;
  const n = el('input'); n.className = 'num'; n.title = 'accepts maths: w/2, -h*0.25';
  const val = () => hasTrack(o, k) ? pv(o, k, curLocal()) : o[k];
  const write = v => { setProp(o, k, curLocal(), v); req(); cb && cb(); };
  r.oninput = () => { write(+r.value); n.value = round(+r.value); };
  n.oninput = () => { const v = evalNum(n.value, val()); write(v); r.value = v; };
  n.onblur = () => { n.value = round(val()); };
  r.onchange = n.onchange = () => push();
  row.append(l, r, n);

  let dia = null;
  if (kf) {
    dia = el('button', 'ic dia'); dia.title = 'Key this value at the playhead · alt-click clears the track';
    dia.onclick = e => {
      const t = curLocal();
      if (e.altKey) { clearTrack(o, k); toast('Track cleared'); }
      else if (keyAt(o, k, t) >= 0) { delKey(o, k, t); toast('Key removed'); }
      else { setKey(o, k, t, val()); toast('Key set at ' + t.toFixed(2) + 's'); }
      push(); sync(); drawKeys(); req();
    };
    row.appendChild(dia);
  }
  const sync = () => {
    const v = val();
    if (document.activeElement !== r) r.value = v;
    if (document.activeElement !== n) n.value = round(v);
    if (dia) {
      const on = hasTrack(o, k), here = on && keyAt(o, k, curLocal()) >= 0;
      dia.textContent = here ? '◆' : on ? '◇' : '◈';
      dia.className = 'ic dia' + (here ? ' k2' : on ? ' k1' : '');
    }
  };
  sync(); inspSync.push(sync);
  p.appendChild(row); return row;
}
const round = v => Math.abs(v) >= 100 ? Math.round(v) : +(+v).toFixed(2);
/* numeric fields accept arithmetic and w/h: "w/2", "-h*0.25", "120+8" */
function evalNum(str, fallback) {
  const t = String(str).trim();
  if (t === '') return fallback;
  if (/^-?\d*\.?\d+$/.test(t)) return +t;
  if (!/^[-+*/().\d\s wh]+$/i.test(t)) return fallback;
  try {
    const v = Function('w', 'h', '"use strict";return (' + t + ')')(P.w, P.h);
    return Number.isFinite(v) ? v : fallback;
  } catch (e) { return fallback; }
}
function sel2(p, label, o, k, opts, cb) {

  [['←', -30, 0], ['→', 30, 0], ['↑', 0, -30], ['↓', 0, 30], ['◼', 0, 0]].forEach(([t, x, y]) => {
