        const b = el('button', 'ic'); b.textContent = n;
        b.title = n + ' frames across';
        b.onclick = () => { L.frameW = Math.floor(a.w / n); L.frameH = a.h; L.frameCount = n; push(); drawInsp(); req(); };
        qw.appendChild(b);
      });
      qr.appendChild(qw); g.appendChild(qr);
    }
    if (a) {
      const ad = el('button', 'sm'); ad.style.margin = '4px'; ad.style.width = 'calc(100% - 8px)';
      ad.textContent = 'Auto-detect grid';
      ad.onclick = () => {
        const gd = detectGrid(a);
        if (!gd) return toast('Could not read that image');
        L.frameW = gd.frameW; L.frameH = gd.frameH; L.frameCount = gd.count;
        push(); drawInsp(); req();
        toast('Detected ' + gd.cols + '×' + gd.rows + ' — ' + gd.frameW + '×' + gd.frameH + ' frames');
      };
      g.appendChild(ad);
    }
    num(g, 'frame w', L, 'frameW', 1, 512, 1, () => drawInsp());
    num(g, 'frame h', L, 'frameH', 1, 512, 1, () => drawInsp());
    num(g, 'first frame', L, 'startFrame', 0, 63, 1, () => drawInsp());
    num(g, 'frame count', L, 'frameCount', 0, 200, 1);
    const hsf = el('div', 'hint');
    hsf.textContent = 'Set first frame to 1 to skip a generator\'s reference cell.';
    g.appendChild(hsf);
    chk(g, 'show grid', L, 'showGrid', () => req());
    num(g, 'fps', L, 'fps', 1, 60, 1);
    num(g, 'start delay', L, 'delay', 0, 10, .05);
    num(g, 'ignore hit stop', L, 'stopScale', 0, 1, .05);
    const hss = el('div', 'hint');
    hss.textContent = '0 freezes with the shot. 1 keeps playing straight through a hit stop — set this on impact VFX so the freeze reads as weight instead of a stutter.';
    g.appendChild(hss);
    chk(g, 'loop', L, 'loop'); chk(g, 'ping‑pong', L, 'pingpong');
    chk(g, 'hold last', L, 'holdLast'); chk(g, 'hide before', L, 'hideBefore');
    const b = el('button', 'sm'); b.style.margin = '4px'; b.textContent = 'Fit shot length to this anim';
    b.onclick = () => {
      const a2 = A[L.assetId]; if (!a2) return toast('No sheet loaded');
      const cols = Math.max(1, Math.floor(a2.w / L.frameW)), rows = Math.max(1, Math.floor(a2.h / L.frameH));
      const total = L.frameCount > 0 ? L.frameCount : cols * rows;
      S.dur = +(L.delay + total / L.fps).toFixed(2);
      push(); refreshAll(); toast('Shot set to ' + S.dur + 's');
    };
    g.appendChild(b);
  }

  g = grp(c, 'Colour', false);
  col(g, 'tint', L, 'tint'); num(g, 'tint amt', L, 'tintAmt', 0, 1, .01, null, 1);
  num(g, 'brightness', L, 'bright', 0, 3, .01, null, 1);
  num(g, 'contrast', L, 'contrast', 0, 3, .01, null, 1);
  num(g, 'saturation', L, 'sat', 0, 3, .01, null, 1);
  num(g, 'hue shift', L, 'hue', -180, 180, 1, null, 1);
  num(g, 'blur', L, 'blur', 0, 8, .1, null, 1);
}

function inspShot(c, S) {
  let g = grp(c, 'Shot');
  txt(g, 'name', S, 'name', () => drawShots());
  num(g, 'duration', S, 'dur', .1, 20, .05, () => { drawShots(); buildTimeline(); });
  col(g, 'background', S, 'bg');

  g = grp(c, 'Transition in');
  sel2(g, 'type', S.tin, 'type', [
    ['cut', 'cut'], ['fade', 'fade through colour'], ['crossfade', 'crossfade'], ['flash', 'flash'],
    ['wipeL', 'wipe →'], ['wipeR', 'wipe ←'], ['wipeU', 'wipe ↓'], ['wipeD', 'wipe ↑'],
    ['slideL', 'slide in ←'], ['slideR', 'slide in →'], ['slideU', 'slide in ↑'],
    ['iris', 'iris'], ['dissolve', 'pixel dissolve']
  ], () => { drawShots(); buildTimeline(); });
  num(g, 'length', S.tin, 'dur', 0, 3, .05, () => { drawShots(); buildTimeline(); });
  col(g, 'colour', S.tin, 'color');
  const h = el('div', 'hint'); h.textContent = 'The transition plays at the start of this shot, over the last frame of the previous one.';
  g.appendChild(h);

  g = grp(c, 'Hit stops');
  const hh = el('div', 'hint');
  hh.textContent = 'Freezes the frame without ending the shot. Three or four frames on the moment of impact is usually enough.';
  g.appendChild(hh);
  (S.stops || []).forEach((st, i) => {
    const r2 = el('div', 'pair');
    const a1 = el('input'); a1.type = 'number'; a1.step = .01; a1.value = st.t; a1.style.width = '58px';
    const a2 = el('input'); a2.type = 'number'; a2.step = .01; a2.min = 0; a2.value = st.dur; a2.style.width = '58px';
    a1.oninput = () => { st.t = +a1.value; req(); drawKeys(); };
    a2.oninput = () => { st.dur = Math.max(0, +a2.value); req(); drawKeys(); buildTimeline(); };
    a1.onchange = a2.onchange = () => push();
    const x = el('button', 'ic'); x.textContent = '✕';
    x.onclick = () => { S.stops.splice(i, 1); push(); drawInsp(); drawKeys(); buildTimeline(); req(); };
    const l1 = el('label'); l1.textContent = 'at'; const l2 = el('label'); l2.textContent = 'for';
    r2.append(l1, a1, l2, a2, x); g.appendChild(r2);
  });
  const ab = el('button', 'sm'); ab.style.margin = '4px'; ab.textContent = '+ Freeze at playhead';
  ab.onclick = () => {
    S.stops = S.stops || [];
    S.stops.push({ t: +curLocal().toFixed(3), dur: +(3 / P.fps).toFixed(3) });
    push(); drawInsp(); drawKeys(); buildTimeline(); req();
  };
  g.appendChild(ab);

  g = grp(c, 'Groups');
  const hg = el('div', 'hint');
  hg.textContent = 'A group moves, scales and fades several layers together. Assign layers to it in the Layer tab.';
  g.appendChild(hg);
  (S.groups || []).forEach((G, i) => {
    const head = el('div', 'pair');
    const nm = el('input'); nm.value = G.name;
    nm.oninput = () => {
      const old = G.name; G.name = nm.value;
      S.layers.forEach(l => { if (l.group === old) l.group = G.name; });
      req();
    };
    nm.onchange = () => { push(); drawInsp(); drawLayers(); };
    const vis = el('input'); vis.type = 'checkbox'; vis.checked = G.visible !== false;
    vis.onchange = () => { G.visible = vis.checked; push(); req(); };
    const x = el('button', 'ic'); x.textContent = '✕';
    x.onclick = () => {
      S.layers.forEach(l => { if (l.group === G.name) l.group = null; });
      S.groups.splice(i, 1); push(); drawInsp(); drawLayers(); req();
    };
    head.append(nm, vis, x); g.appendChild(head);
    const popts = [['', 'top level']].concat(
      (S.groups || []).filter(o => o !== G).map(o => [o.name, 'inside ' + o.name]));
    sel2(g, '  inside', G, 'parent', popts, () => { push(); req(); });
    const n2 = S.layers.filter(l => l.group === G.name).length;
    num(g, '  offset x', G, 'x', -P.w, P.w, 1, null, 1);
    num(g, '  offset y', G, 'y', -P.h, P.h, 1, null, 1);
    num(g, '  scale', G, 'scale', .1, 4, .01, null, 1);
    num(g, '  opacity', G, 'opacity', 0, 1, .01, null, 1);
    const cnt = el('div', 'hint'); cnt.textContent = n2 + ' layer' + (n2 === 1 ? '' : 's') + ' in this group';
    g.appendChild(cnt);
  });
  const gb = el('button', 'sm'); gb.style.margin = '4px'; gb.textContent = '+ Add group';
  gb.onclick = () => {
    S.groups = S.groups || [];
    S.groups.push({ name: 'Group ' + (S.groups.length + 1), x: 0, y: 0, scale: 1, opacity: 1, visible: true, parent: null, k: null });
    push(); drawInsp();
  };
  g.appendChild(gb);

  g = grp(c, 'Markers');
  const hm2 = el('div', 'hint');
  hm2.textContent = 'Named beats. Dragging a keyframe snaps to them, so several layers land on the same instant exactly. Hold alt while dragging to ignore.';
  g.appendChild(hm2);
  (S.markers || []).forEach((mk, i) => {
    const r2 = el('div', 'pair');
    const t2 = el('input'); t2.type = 'number'; t2.step = .01; t2.value = mk.t; t2.style.width = '54px';
    t2.oninput = () => { mk.t = +t2.value; drawKeys(); drawGraph(); }; t2.onchange = () => push();
    const nm = el('input'); nm.value = mk.name;
    nm.oninput = () => { mk.name = nm.value; drawKeys(); drawGraph(); }; nm.onchange = () => push();
    const x = el('button', 'ic'); x.textContent = '✕';
    x.onclick = () => { S.markers.splice(i, 1); push(); drawInsp(); drawKeys(); drawGraph(); };
    r2.append(t2, nm, x); g.appendChild(r2);
  });
  const mb = el('button', 'sm'); mb.style.margin = '4px'; mb.textContent = '+ Marker at playhead';
  mb.onclick = () => {
    S.markers = S.markers || [];
    S.markers.push({ t: +curLocal().toFixed(3), name: 'beat ' + (S.markers.length + 1) });
    push(); drawInsp(); drawKeys(); drawGraph();
  };
  g.appendChild(mb);

  g = grp(c, 'Sequence', false);
  const hsq = el('div', 'hint');
  hsq.textContent = 'By default the next shot plays. Set a jump, or add conditions on your variables, and this becomes a branching scene. The first matching condition wins.';
  g.appendChild(hsq);
  const nopts = [['', 'next shot in order']].concat(P.shots.filter(x => x !== S).map(x => [x.name, '→ ' + x.name]));
  sel2(g, 'then go to', S, 'next', nopts, () => { buildTimeline(); req(); });
  (S.branch || []).forEach((b, i) => {
    const r2 = el('div', 'pair');
    const cd = el('input'); cd.value = b.cond; cd.placeholder = 'FLAG == value';
    cd.oninput = () => { b.cond = cd.value; }; cd.onchange = () => { push(); buildTimeline(); req(); };
    const to = el('select');
    P.shots.filter(x => x !== S).forEach(x => { const o = el('option'); o.value = x.name; o.textContent = '→ ' + x.name; to.appendChild(o); });
    to.value = b.to;
    to.onchange = () => { b.to = to.value; push(); buildTimeline(); req(); };
    const st = el('span'); st.textContent = condTrue(b) ? '✓' : '·';
    st.style.cssText = 'color:' + (condTrue(b) ? 'var(--cyan)' : 'var(--dim)') + ';width:12px';
    const x = el('button', 'ic'); x.textContent = '✕';
    x.onclick = () => { S.branch.splice(i, 1); push(); drawInsp(); buildTimeline(); req(); };
    r2.append(st, cd, to, x); g.appendChild(r2);
  });
  const bb2 = el('button', 'sm'); bb2.style.margin = '4px'; bb2.textContent = '+ Condition';
  bb2.onclick = () => {
    const other = P.shots.find(x => x !== S);
    if (!other) return toast('Need another shot to branch to');
    S.branch = S.branch || [];
    S.branch.push({ cond: 'FLAG == value', to: other.name });
    push(); drawInsp();
  };
  g.appendChild(bb2);
  const fw2 = el('div', 'row2'); fw2.innerHTML = '<label>preview</label>';
  const fwv = el('div'); const fc = el('input'); fc.type = 'checkbox'; fc.checked = followBranches;
  fc.onchange = () => {
    followBranches = fc.checked; time = 0;
    buildTimeline(); drawShots(); req();
    toast(followBranches ? 'Following branches' : 'Playing every shot in order');
  };
  fwv.appendChild(fc); fw2.appendChild(fwv);
  const fl = el('label'); fl.textContent = ' follow branches';
  fl.style.cssText = 'font-size:10px;color:var(--dim)';
  fwv.appendChild(fl);
  g.appendChild(fw2);

  g = grp(c, 'Events');
  const he = el('div', 'hint');
  he.textContent = 'Timestamps your engine listens for — spawn a scar, apply damage, shake the tactical camera. Events never affect the rendered image.';
  g.appendChild(he);
  (S.events || []).forEach((m, i) => {
    const r2 = el('div', 'pair');
    const t2 = el('input'); t2.type = 'number'; t2.step = .01; t2.value = m.t; t2.style.width = '50px';
    t2.oninput = () => { m.t = +t2.value; drawKeys(); }; t2.onchange = () => push();
    const nm = el('input'); nm.value = m.name; nm.style.width = '78px'; nm.placeholder = 'name';
    nm.oninput = () => { m.name = nm.value; }; nm.onchange = () => push();
    const dv = el('input'); dv.value = m.data || ''; dv.placeholder = 'data (optional)';
    dv.oninput = () => { m.data = dv.value; }; dv.onchange = () => push();
    const x = el('button', 'ic'); x.textContent = '✕';
    x.onclick = () => { S.events.splice(i, 1); push(); drawInsp(); drawKeys(); };
    r2.append(t2, nm, dv, x); g.appendChild(r2);
  });
  const eb = el('button', 'sm'); eb.style.margin = '4px'; eb.textContent = '+ Event at playhead';
  eb.onclick = () => {
    S.events = S.events || [];
    S.events.push({ t: +curLocal().toFixed(3), name: 'impact', data: '' });
    push(); drawInsp(); drawKeys();
  };
  g.appendChild(eb);

  g = grp(c, 'Sound', false);
  const hs = el('div', 'hint');
  hs.textContent = 'Cues are timestamps in the exported data — your engine plays them. They also preview here.';
  g.appendChild(hs);
  (S.audio || []).forEach((m, i) => {
    const r2 = el('div', 'pair');
    const t2 = el('input'); t2.type = 'number'; t2.step = .01; t2.value = m.t; t2.style.width = '52px';
    t2.oninput = () => { m.t = +t2.value; }; t2.onchange = () => push();
    const ss = el('select');
    Object.values(AU).forEach(a2 => { const o = el('option'); o.value = a2.id; o.textContent = a2.name; ss.appendChild(o); });
    ss.value = m.auId; ss.onchange = () => { m.auId = ss.value; push(); };
    const v = el('input'); v.type = 'number'; v.step = .05; v.min = 0; v.max = 1; v.value = m.vol; v.style.width = '44px';
    v.oninput = () => { m.vol = clamp(+v.value, 0, 1); }; v.onchange = () => push();
    const pl = el('button', 'ic'); pl.textContent = '▶';
    pl.onclick = () => { const a2 = AU[m.auId]; if (a2) { const e2 = a2.el.cloneNode(); e2.volume = m.vol; e2.play().catch(() => { }); } };
    const x = el('button', 'ic'); x.textContent = '✕';
    x.onclick = () => { S.audio.splice(i, 1); push(); drawInsp(); };
    r2.append(t2, ss, v, pl, x); g.appendChild(r2);
  });
  const wa = el('div'); wa.style.display = 'flex'; wa.style.gap = '4px'; wa.style.padding = '4px';
  const ai = el('button', 'sm'); ai.textContent = 'Import sound…'; ai.style.flex = '1';
  ai.onclick = () => $('#fileAud').click();
  const ac = el('button', 'sm'); ac.textContent = '+ Cue here'; ac.style.flex = '1';
  ac.onclick = () => {
    const first = Object.keys(AU)[0];
    if (!first) return toast('Import a sound first');
    S.audio = S.audio || [];
    S.audio.push({ t: +curLocal().toFixed(3), auId: first, vol: 1 });
    push(); drawInsp();
  };
  wa.append(ai, ac); g.appendChild(wa);

  g = grp(c, 'Library');
  const hl = el('div', 'hint');
  hl.textContent = 'Save this shot as a template with its assets, and drop it into any project later.';
  g.appendChild(hl);
  const lw = el('div'); lw.style.cssText = 'display:flex;gap:4px;padding:4px';
  const lb1 = el('button', 'sm'); lb1.textContent = 'Save shot'; lb1.style.flex = '1'; lb1.onclick = libSave;
  const lb2 = el('button', 'sm'); lb2.textContent = 'Insert from library…'; lb2.style.flex = '1'; lb2.onclick = libModal;
  lw.append(lb1, lb2); g.appendChild(lw);

  g = grp(c, 'Reorder');
  const w = el('div'); w.style.display = 'flex'; w.style.gap = '4px'; w.style.padding = '4px';
  [['▲ up', 'up'], ['▼ down', 'dn'], ['⧉ dup', 'dup'], ['✕ delete', 'del']].forEach(([t, a]) => {
    const b = el('button', 'sm'); b.textContent = t; b.style.flex = '1';
    b.onclick = () => shotAction(sel.shot, a); w.appendChild(b);
  });
  g.appendChild(w);
}

function inspCam(c, S) {
  const C = S.cam;
  let g = grp(c, 'Camera move');
  num(g, 'pan x', C, 'panX', -200, 200, 1, null, 1);
  num(g, 'pan y', C, 'panY', -200, 200, 1, null, 1);
  num(g, 'zoom start', C, 'zoom0', .5, 3, .01);
  num(g, 'zoom end', C, 'zoom1', .5, 3, .01);
  sel2(g, 'easing', C, 'ease', [['linear', 'linear'], ['in', 'ease in'], ['out', 'ease out'], ['inout', 'ease in‑out']]);

  const fopts = [['', 'none — fixed pan']].concat(S.layers.map(l => [l.id, l.name]));
  sel2(g, 'follow layer', C, 'follow', fopts, () => { drawInsp(); req(); });
  if (C.follow) {
    num(g, 'follow amount', C, 'followAmt', 0, 1, .01, null, 1);
    num(g, 'screen x', C, 'followX', 0, 1, .01);
    num(g, 'screen y', C, 'followY', 0, 1, .01);
    const hf = el('div', 'hint');
    hf.textContent = 'The camera keeps that layer at this fraction of the frame. Amount 1 locks on; 0.3 drifts after it. Pan still adds on top.';
    g.appendChild(hf);
  }
  const h = el('div', 'hint');
  h.textContent = 'Pan moves the whole scene over the shot. Each layer multiplies it by its own parallax value — that is where the depth comes from.';
  g.appendChild(h);

  g = grp(c, 'Shake');
  num(g, 'amount', C, 'shake', 0, 20, .5, null, 1);
  num(g, 'frequency', C, 'shakeFreq', 1, 80, 1);
  chk(g, 'decay', C, 'shakeDecay');

  g = grp(c, 'Depth helper');
  const w = el('div'); w.style.padding = '4px'; w.style.display = 'grid'; w.style.gap = '4px';
  const b1 = el('button', 'sm'); b1.textContent = 'Auto‑stagger parallax by depth';
  b1.onclick = () => {
    const n = S.layers.length; if (!n) return;
    S.layers.forEach((L, i) => { L.parallax = +(1.7 - (1.7 - .05) * (i / Math.max(1, n - 1))).toFixed(2); });
    push(); drawLayers(); drawInsp(); req(); toast('Parallax staggered front → back');
  };
  const b2 = el('button', 'sm'); b2.textContent = 'Auto‑stagger scroll speed';
  b2.onclick = () => {
    const n = S.layers.length; if (!n) return;

    push(); drawLayers(); drawInsp(); req(); toast('Speeds staggered');
  };
  w.append(b1, b2); g.appendChild(w);
}

function inspUnits(c) {
  let g = grp(c, 'Slots');
  const h1 = el('div', 'hint');
  h1.textContent = 'A slot is a role in the scene. Point it at a unit to preview; your game binds the real one at playback.';
  g.appendChild(h1);
  (P.slots || []).forEach((sl, i) => {
    const r = el('div', 'pair');
    const nm = el('input'); nm.value = sl.name; nm.style.width = '84px';
    nm.oninput = () => {
      const old = sl.name;
      sl.name = nm.value.toUpperCase().replace(/[^A-Z0-9_]/g, '');
      P.shots.forEach(sh => sh.layers.forEach(l => { if (l.slot === old) l.slot = sl.name; }));
      req();
    };
    nm.onchange = () => { push(); drawInsp(); };
    const us = el('select');
    const o0 = el('option'); o0.value = ''; o0.textContent = '(no unit)'; us.appendChild(o0);
    (P.units || []).forEach(u => { const o = el('option'); o.value = u.id; o.textContent = u.name; us.appendChild(o); });
    us.value = sl.unit || '';
    us.onchange = () => { sl.unit = us.value || null; push(); drawInsp(); req(); };
    const x = el('button', 'ic'); x.textContent = '✕';
    x.onclick = () => {
      P.shots.forEach(sh => sh.layers.forEach(l => { if (l.slot === sl.name) l.slot = null; }));

function dl(blob, name) {
  const u = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = u; a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(u), 4000);
}
const safeName = () => (P.name || 'cutscene').replace(/[^\w\-]+/g, '_');

function saveProject() {
  const data = {
    version: 1, project: P,
    assets: Object.values(A).map(a => ({ id: a.id, name: a.name, src: a.src, gif: a.gif || null })),
    sounds: Object.values(AU).map(a => ({ id: a.id, name: a.name, src: a.src }))
  };
  dl(new Blob([JSON.stringify(data)], { type: 'application/json' }), safeName() + '.parallax.json');
  idbDel('autosave');
  toast('Project saved');
}
$('#bSave').onclick = saveProject;
$('#bOpen').onclick = () => $('#fileProj').click();
$('#fileProj').onchange = e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => loadProject(r.result); r.readAsText(f); e.target.value = ''; };
$('#fileProjMulti').onchange = e => {
  const files = [...(e.target.files || [])].filter(f => /\.json$/i.test(f.name));
  e.target.value = '';
  if (!files.length) return toast('No JSON files selected');
  let i = 0;
  const next = () => {
    if (i >= files.length) { toast('Imported ' + files.length + ' scene(s) — last one is active'); return; }
    const f = files[i++];
    const r = new FileReader();
    r.onload = () => { loadProject(r.result); setTimeout(next, 80); };
    r.readAsText(f);
  };
  next();
};

function loadProject(text) {
  let d; try { d = JSON.parse(text); } catch { return toast('That file is not a valid project'); }
  if (!d.project || !d.project.shots) return toast('No cutscene found in that file');
  A = {}; AU = {}; tintCache.clear(); palCache.clear(); resetAudio();
  (d.sounds || []).forEach(a => {
    const e2 = new Audio(); e2.src = a.src;
    AU[a.id] = { id: a.id, name: a.name, src: a.src, el: e2, peaks: null };
    peaksFor(AU[a.id]);
  });
  Promise.all((d.assets || []).map(a => new Promise(res => {
    const im = new Image();
    im.onload = () => { A[a.id] = { id: a.id, name: a.name, src: a.src, img: im, w: im.naturalWidth, h: im.naturalHeight, gif: a.gif || null }; res(); };
    im.onerror = res; im.src = a.src;
  }))).then(() => {
    P = d.project;
    P.units = P.units || []; P.slots = P.slots || [];
    P.palettes = P.palettes || []; P.vars = P.vars || {};
    P.shots.forEach(S => S.layers.forEach(l => { if (!l.action) l.action = 'idle'; }));
    P.shots.forEach(S => {
      S.stops = S.stops || []; S.audio = S.audio || []; S.events = S.events || [];
      S.groups = S.groups || []; S.markers = S.markers || [];
      S.branch = S.branch || []; if (S.next === undefined) S.next = null;
      S.layers.forEach(l => { if (l.stopScale == null) l.stopScale = 0; });
    });
    sel = { shot: 0, layer: 0 }; time = 0;
    hist = []; hIdx = -1; push(); refreshAll(); applyZoom();
    toast('Opened ' + (P.name || 'project'));
  });
}
$('#bNew').onclick = () => { if (!confirm('Start a new empty project?')) return; P = newProject(); A = {}; AU = {}; tintCache.clear(); palCache.clear(); resetAudio(); sel = { shot: 0, layer: 0 }; time = 0; hist = []; hIdx = -1; push(); refreshAll(); applyZoom(); };

   sensible timing. A starting point to edit, not a finished one. */
function autoScene(unitId, slotName) {
  const u = (P.units || []).find(x => x.id === unitId);
  if (!u) return toast('Pick a unit first');
  const has = k => !!u.actions[k];
  const dur = k => {
    const a = u.actions[k];
    return a ? Math.max(.4, +(a.frames / Math.max(1, a.fps)).toFixed(2)) : .8;
  };
  let slot = (P.slots || []).find(x => x.name === slotName);
  if (!slot) { P.slots = P.slots || []; slot = { name: slotName || 'ATTACKER', unit: u.id }; P.slots.push(slot); }
  slot.unit = u.id;

  // reuse the current shot's scenery so the generated scene is in-world
  const base = P.shots[sel.shot];
  const scenery = () => (base ? base.layers.filter(l => !l.slot && l.kind !== 'text' && l.kind !== 'panel')
    .map(l => { const c = JSON.parse(JSON.stringify(l)); c.id = uid(); c.maskLayer = null; return c; }) : []);
  const mk = (name, d, layers, over) => Object.assign(newShot({ name, dur: d, layers }), over || {});
  const out = [];

  const approach = has('move') ? Math.max(1.6, dur('move') * 2) : 1.8;
  const s1 = mk(u.name + ' · approach', approach, [
    newLayer('anim', {
      name: u.name, slot: slot.name, action: has('move') ? 'move' : Object.keys(u.actions)[0],
      anchor: 'bottom', y: -14, scale: .95, mblur: .6,
      k: { x: [{ t: 0, v: -Math.round(P.w * .45), e: 'out' },
               { t: approach, v: -Math.round(P.w * .06), e: 'linear' }] }
    })
  ].concat(scenery()), { tin: { type: 'fade', dur: .5, color: '#000000' } });
  s1.cam.panX = 24; s1.cam.zoom1 = 1.06;
  Object.assign(s1.fx, { vignette: .44, grain: .08, bars: .15 });
  s1.markers = [{ t: +(approach * .6).toFixed(2), name: 'in position' }];
  out.push(s1);

  if (has('charge')) {
    const d = Math.max(1.0, dur('charge'));
    const s = mk(u.name + ' · charge', d, [
      newLayer('anim', { name: u.name, slot: slot.name, action: 'charge',
        anchor: 'bottom', y: -14, scale: .95, x: -Math.round(P.w * .06), loop: false, holdLast: true })
    ].concat(scenery()));
    s.cam.zoom0 = 1.06; s.cam.zoom1 = 1.18; s.cam.ease = 'in';
    s.cam.shake = 1.2; s.cam.shakeDecay = false;
    Object.assign(s.fx, { vignette: .5, grain: .1, bars: .15, chroma: .6 });
    s.fx.k = { tintAmt: [{ t: 0, v: .02, e: 'in' }, { t: d, v: .28, e: 'linear' }] };
    s.markers = [{ t: +(d * .8).toFixed(2), name: 'peak' }];
    out.push(s);
  }

  const fa = has('fire') ? 'fire' : has('special') ? 'special' : null;
  if (fa) {
    const d = Math.max(.9, dur(fa) + .4);
    const s = mk(u.name + ' · fire', d, [
      newLayer('distort', { name: 'Shockwave', kind: 'distort', fxMode: 'ripple',
        anchor: 'center', fxW: P.w, fxH: P.h, amp: 5, freq: 9, speed: 3, band: 2,
        k: { amp: [{ t: 0, v: 7, e: 'out' }, { t: Math.min(d, .5), v: 0, e: 'linear' }] } }),
      newLayer('anim', { name: u.name, slot: slot.name, action: fa,
        anchor: 'bottom', y: -14, scale: .95, x: -Math.round(P.w * .12), loop: false, holdLast: true })
    ].concat(scenery()), { tin: { type: 'flash', dur: .14, color: '#ffffff' } });
    s.cam.zoom0 = 1.18; s.cam.zoom1 = 1.0; s.cam.shake = 5; s.cam.shakeFreq = 34;
    Object.assign(s.fx, { flash: .85, flashDur: .14, vignette: .5, grain: .14, chroma: 2, bars: .15 });
    s.stops = [{ t: .12, dur: .1 }];
    s.markers = [{ t: .12, name: 'impact' }];
    s.events = [{ t: .12, name: 'impact', data: '' }];
    out.push(s);
  }

  if (has('hit') || has('die')) {
    const k = has('die') ? 'die' : 'hit';
    const d = Math.max(1.2, dur(k) + .6);
    const s = mk(u.name + ' · ' + k, d, [
      newLayer('text', { name: 'Damage', text: '-{DAMAGE}', anchor: 'center', align: 'center',
        fontSize: 38, textColor: '#ff4fa3', outline: 3, outlineColor: '#1a0410', x: Math.round(P.w * .18),
        k: { opacity: [{ t: 0, v: 0 }, { t: .28, v: 1, e: 'linear' }, { t: d - .5, v: 1, e: 'in' }, { t: d, v: 0 }],
             y: [{ t: 0, v: -8, e: 'out' }, { t: d, v: -52, e: 'linear' }] } }),
      newLayer('anim', { name: u.name, slot: slot.name, action: k,
        anchor: 'bottom', y: -14, scale: .95, loop: false, holdLast: true, flipH: true })
    ].concat(scenery()), { tin: { type: 'wipeL', dur: .24, color: '#000000' } });
    s.cam.zoom0 = 1.08; s.cam.zoom1 = 1.0; s.cam.shake = 2.4;
    Object.assign(s.fx, { vignette: .55, grain: .13, sat: .8, bars: .15 });
    out.push(s);
  }

  P.vars = P.vars || {}; if (!P.vars.DAMAGE) P.vars.DAMAGE = '48';
  P.shots.splice(sel.shot + 1, 0, ...out);
  sel.shot += 1; sel.layer = 0;
  push(); refreshAll();
  toast('Generated ' + out.length + ' shots for ' + u.name);
}

/* ── §24 shot library ───────────────────────────────────
   Shots saved with the assets they reference, so a template
   carries into any project. */
async function libAll() { return (await idbGet('library')) || []; }
async function libSave() {
  const S = P.shots[sel.shot];
  const nm = prompt('Save this shot to the library as:', S.name);
  if (!nm) return;
  const used = new Set();
  S.layers.forEach(l => l.assetId && used.add(l.assetId));
  const lib = await libAll();
  lib.push({
    id: uid(), name: nm, savedAt: Date.now(), shot: JSON.parse(JSON.stringify(S)),
    assets: [...used].filter(i => A[i]).map(i => ({ id: i, name: A[i].name, src: A[i].src, gif: A[i].gif || null }))
  });
  if (await idbPut('library', lib)) { toast('Saved "' + nm + '" to the library'); drawInsp(); }
  else toast('Could not write to the library');
}
async function libInsert(entry) {
  const have = new Set(Object.keys(A));
  const byName = {}; Object.values(A).forEach(a => byName[a.name] = a.id);
  const remap = {};
  for (const a of entry.assets || []) {
    if (have.has(a.id)) { remap[a.id] = a.id; continue; }
    if (byName[a.name]) { remap[a.id] = byName[a.name]; continue; }
    const nw = await addAsset(a.name, a.src, { gif: a.gif });
    remap[a.id] = nw.id;
  }
  const sh = JSON.parse(JSON.stringify(entry.shot));
  sh.id = uid();
  const idMap = {};
  sh.layers.forEach(l => { const old = l.id; l.id = uid(); idMap[old] = l.id; });
  sh.layers.forEach(l => {
    if (l.assetId && remap[l.assetId]) l.assetId = remap[l.assetId];
    if (l.maskLayer && idMap[l.maskLayer]) l.maskLayer = idMap[l.maskLayer];
  });
  if (sh.cam && sh.cam.follow && idMap[sh.cam.follow]) sh.cam.follow = idMap[sh.cam.follow];
  P.shots.splice(sel.shot + 1, 0, sh); sel.shot++;
  push(); refreshAll(); closeModal();
  toast('Inserted "' + entry.name + '"');
}
async function libModal() {
  const lib = await libAll();
  if (!lib.length) return toast('Library is empty — save a shot first');
  modal(`<h3>Shot library</h3><p>${lib.length} saved shot${lib.length === 1 ? '' : 's'}.
    Inserting brings its assets across, reusing anything already loaded by name.</p>
    <div id="libL" style="display:grid;gap:5px"></div>`, box => {
    const w = box.querySelector('#libL');
    lib.forEach((e2, i) => {
      const r = el('div', 'pair');
      const b = el('button'); b.style.flex = '1'; b.style.textAlign = 'left';
      b.textContent = `${e2.name} — ${e2.shot.layers.length} layers, ${e2.shot.dur}s`;
      b.onclick = () => libInsert(e2);
      const x = el('button', 'ic'); x.textContent = '✕';
      x.onclick = async () => { lib.splice(i, 1); await idbPut('library', lib); closeModal(); libModal(); };
      r.append(b, x); w.appendChild(r);

/* ── §25 batch render ───────────────────────────────────
   One cutscene, every unit: rebind a slot in turn and export
   a sheet each. */
async function batchRender(slotName, scale, btn) {
  if (exporting) return;
  const slot = (P.slots || []).find(x => x.name === slotName);
  if (!slot) return toast('No such slot');
  const units = P.units || [];
  if (!units.length) return toast('No units defined');
  const original = slot.unit;
  exporting = true;
  const files = [];
  try {
    for (let u = 0; u < units.length; u++) {
      slot.unit = units[u].id;
      tintCache.clear(); palCache.clear();
      btn.textContent = `Rendering ${u + 1}/${units.length}…`;
      const total = totalTime(), nf = Math.max(1, Math.round(total * P.fps));
      const cols = Math.min(nf, Math.max(1, Math.ceil(Math.sqrt(nf * P.h / P.w))));
      const rows = Math.ceil(nf / cols);
      const cv = document.createElement('canvas');
      cv.width = cols * P.w * scale; cv.height = rows * P.h * scale;
      const cx = cv.getContext('2d'); cx.imageSmoothingEnabled = false;
      const src = document.createElement('canvas'); src.width = P.w; src.height = P.h;
      const sx = src.getContext('2d');
      for (let i = 0; i < nf; i++) {
        renderFrame(sx, i / P.fps, P.w, P.h, false);
        cx.drawImage(src, (i % cols) * P.w * scale, Math.floor(i / cols) * P.h * scale,
          P.w * scale, P.h * scale);
        setBar((u + i / nf) / units.length);
        if (i % 8 === 0) await new Promise(r => setTimeout(r));
      }
      const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
      const safe = units[u].name.replace(/[^\w\-]+/g, '_');
      files.push({ name: `${safeName()}/${safe}_${cols}x${rows}.png`,
                   data: new Uint8Array(await blob.arrayBuffer()) });
    }
    setBar(-1); btn.textContent = 'Packing…';
    files.push({ name: `${safeName()}/manifest.txt`,
      data: new TextEncoder().encode(
        `${P.name}\nslot: ${slotName}\n${P.fps} fps · ${P.w}x${P.h} · scale ${scale}x\n\n`
        + units.map(u => '- ' + u.name).join('\n') + '\n') });
    dl(await makeZip(files), safeName() + '_batch.zip');
    toast(units.length + ' cutscenes rendered');
  } catch (e2) { toast('Batch stopped: ' + e2.message); }
  finally {
    slot.unit = original; tintCache.clear(); palCache.clear();
    setBar(-1); exporting = false; btn.textContent = 'Batch render every unit';
    req();
  }
}

/* ── §26 live folder sync ───────────────────────────────
   Pick a folder once; the engine-facing JSON is rewritten on
   every change so a running game can hot-reload it. */
let syncDir = null, syncTimer = null;
async function pickSyncDir() {
  if (!window.showDirectoryPicker) return toast('This browser has no folder access — use the desktop build');
  try {
    syncDir = await window.showDirectoryPicker({ mode: 'readwrite' });
    toast('Live sync on — writing on every change');
    updateSyncTag(); syncNow();
  } catch (e2) { }
}
function updateSyncTag() {
  const t = $('#syncTag'); if (!t) return;
  t.textContent = syncDir ? '● live' : '';
  t.style.color = syncDir ? 'var(--cyan)' : 'var(--dim)';
}
async function syncNow() {
  if (!syncDir) return;
  try {
    const fh = await syncDir.getFileHandle(safeName() + '.cutscene.json', { create: true });
    const w = await fh.createWritable();
    await w.write(engineDoc());
    await w.close();
  } catch (e2) { syncDir = null; updateSyncTag(); toast('Live sync stopped: ' + e2.message); }
}
function scheduleSync() {
  if (!syncDir) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(syncNow, 600);
}

/* ── unit manifest i/o ─────────────────────────────────── */
function exportUnits() {
  const out = {
    format: 'parallax-units', version: 1,
    units: (P.units || []).map(u => ({
      name: u.name,
      actions: Object.fromEntries(Object.entries(u.actions).map(([k, a]) => [k, {
        sheet: A[a.assetId] ? A[a.assetId].name + '.png' : null,
        frameW: a.frameW, frameH: a.frameH, frames: a.frames, fps: a.fps,
        pivotX: a.pivotX == null ? Math.round(a.frameW / 2) : a.pivotX,
        pivotY: a.pivotY == null ? a.frameH : a.pivotY,
        pivot: { x: +((a.pivotX == null ? a.frameW / 2 : a.pivotX) / a.frameW).toFixed(4),
                 y: +((a.pivotY == null ? a.frameH : a.pivotY) / a.frameH).toFixed(4) },
        groundOffsetY: a.groundOffsetY || 0,
        attach: a.attach || {}
      }]))
    }))
  };

  toast('Unit manifest exported');
}
$('#fileUnits').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    let d; try { d = JSON.parse(r.result); } catch { return toast('Not a valid manifest'); }
    if (!d.units) return toast('No units found in that file');
    const byName = {}; Object.values(A).forEach(a => { byName[a.name] = a.id; });
    let matched = 0, total = 0;
    P.units = P.units || [];
    d.units.forEach(u => {
      const nu = newUnit(u.name);
      Object.entries(u.actions || {}).forEach(([k, a]) => {
        total++;
        const base = (a.sheet || '').replace(/\.[^.]+$/, '');
        const id = byName[base] || null;
        if (id) matched++;
        // pivots may arrive absolute (px) or normalized ({x:0.5,y:1.0})
        let pxv = a.pivotX, pyv = a.pivotY;
        const pn = a.pivot || u.pivot || d.pivot;
        if (pn && typeof pn === 'object') {
          if (pxv == null && pn.x != null) pxv = pn.x * a.frameW;
          if (pyv == null && pn.y != null) pyv = pn.y * a.frameH;
        }
        nu.actions[k] = newAction(id, {
          frameW: a.frameW, frameH: a.frameH, frames: a.frames, fps: a.fps,
          pivotX: pxv == null ? null : Math.round(pxv),
          pivotY: pyv == null ? null : Math.round(pyv),
          groundOffsetY: a.groundOffsetY != null ? a.groundOffsetY
            : (u.groundOffsetY != null ? u.groundOffsetY : (d.groundOffsetY || 0)),
          attach: a.attach || {}
        });
      });
      P.units.push(nu);
    });
    push(); drawInsp(); req();
    toast(`Imported ${d.units.length} unit(s) — ${matched}/${total} sheets matched by name`);
  };
  r.readAsText(f); e.target.value = '';
};

function engineDoc() { return JSON.stringify(buildEngineDoc(), null, 2); }
function exportData() {
  dl(new Blob([engineDoc()], { type: 'application/json' }), safeName() + '.cutscene.json');
  toast('Cutscene data exported');
}
function buildEngineDoc() {
  const used = new Set();
  P.shots.forEach(s => s.layers.forEach(l => l.assetId && used.add(l.assetId)));
  const audUsed = new Set();
  P.shots.forEach(S => (S.audio || []).forEach(m => audUsed.add(m.auId)));
  const out = {
    format: 'parallax-cutscene', version: 1, minor: 1,
    name: P.name, width: P.w, height: P.h, fps: P.fps,
    assets: [...used].filter(id => A[id]).map(id => ({ key: id, file: A[id].name + '.png', width: A[id].w, height: A[id].h })),
    sounds: [...audUsed].filter(id => AU[id]).map(id => ({ key: id, file: AU[id].name })),
    slots: (P.slots || []).map(sl => ({ name: sl.name })),
    units: (P.units || []).map(u => ({
      name: u.name,
      actions: Object.fromEntries(Object.entries(u.actions).map(([k, a]) => [k, {
        sheet: A[a.assetId] ? A[a.assetId].name + '.png' : null,
        frameW: a.frameW, frameH: a.frameH, frames: a.frames, fps: a.fps,
        pivotX: a.pivotX == null ? Math.round(a.frameW / 2) : a.pivotX,
        pivotY: a.pivotY == null ? a.frameH : a.pivotY,
        pivot: { x: +((a.pivotX == null ? a.frameW / 2 : a.pivotX) / a.frameW).toFixed(4),
                 y: +((a.pivotY == null ? a.frameH : a.pivotY) / a.frameH).toFixed(4) },
        groundOffsetY: a.groundOffsetY || 0,
        attach: a.attach || {}
      }]))
    })),
    palettes: (P.palettes || []).map(pl => ({ id: pl.id, name: pl.name, pairs: pl.pairs })),
    variables: Object.keys(P.vars || {}),
    shots: P.shots.map(S => ({
      name: S.name, duration: S.dur, background: S.bg,
      transition_in: { ...S.tin },
      camera: { ...S.cam },
      grade: { ...S.fx },
      stops: (S.stops || []).map(x => ({ ...x })),
      groups: (S.groups || []).map(x => ({ ...x })),
      markers: (S.markers || []).map(x => ({ ...x })),
      branch: (S.branch || []).map(x => ({ ...x })),
      next: S.next || null,
      audio: (S.audio || []).map(m => ({ t: m.t, sound: AU[m.auId] ? AU[m.auId].name : null, volume: m.vol })),
      events: (S.events || []).map(m => {
        let d = m.data;
        if (typeof d === 'string' && d.trim()) { try { d = JSON.parse(d); } catch (e) { } }
        return { t: m.t, name: m.name, data: d === '' ? null : d };
      }),
      layers: S.layers.map(L => {
        const o = { ...L }; delete o.id;
        o.asset = (!L.slot && L.assetId && A[L.assetId]) ? A[L.assetId].name + '.png' : null;
        delete o.assetId;
        if (o.slot) { o.slotAction = o.slot + '.' + (o.action || 'idle'); }
        else { delete o.slot; delete o.action; }
        if (!o.palette) delete o.palette;
        if (!o.k) delete o.k;
        return o;
      })
    }))
  };
  return out;
}

function recordWebM(scale, btn) {
  if (exporting) return;
  const W = P.w * scale, H = P.h * scale;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const cx = cv.getContext('2d'); cx.imageSmoothingEnabled = false;
  const src = document.createElement('canvas'); src.width = P.w; src.height = P.h;
  const sx = src.getContext('2d');
  let mime = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'].find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m));
  if (!mime) return toast('This browser cannot record WebM — use the PNG sequence instead');
  const stream = cv.captureStream(P.fps);
  const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 12000000 });
  const chunks = [];
  rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  rec.onstop = () => { dl(new Blob(chunks, { type: 'video/webm' }), safeName() + '.webm'); exporting = false; btn.textContent = 'Record WebM'; toast('WebM saved'); };

  exporting = true; playing = false; setPlaying(false);
  btn.textContent = 'Recording…';
  const total = totalTime(); let t0 = performance.now();
  rec.start();
  const step = () => {
    const t = (performance.now() - t0) / 1000;
    renderFrame(sx, Math.min(t, total), P.w, P.h, false);
    cx.clearRect(0, 0, W, H); cx.drawImage(src, 0, 0, W, H);
    if (t < total) requestAnimationFrame(step); else setTimeout(() => rec.stop(), 120);
  };
  requestAnimationFrame(step);
}

function setBar(p) { const b = $('#bar'); if (!b) return; b.classList.toggle('on', p >= 0 && p < 1); b.firstElementChild.style.width = (p * 100) + '%'; }

/* ── zip writer ─────────────────────────────────────────
   Minimal but valid ZIP (PKZIP appnote 4.3). Deflate via the
   platform's own CompressionStream when present, stored
   otherwise. No third-party code, works offline. */
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let i = 0; i < 256; i++) {
    let c = i;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[i] = c >>> 0;
  }
  return t;
})();
function crc32(buf) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < buf.length; i++) c = CRC_TABLE[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
async function deflateRaw(bytes) {
  if (typeof CompressionStream === 'undefined') return null;
  try {
    const cs = new CompressionStream('deflate-raw');
    const stream = new Blob([bytes]).stream().pipeThrough(cs);
    return new Uint8Array(await new Response(stream).arrayBuffer());
  } catch (e) { return null; }
}
function dosTime(d) {
  return { t: ((d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1)) & 0xFFFF,
           d: (((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate()) & 0xFFFF };
}
async function makeZip(files) {
  // files: [{name, data:Uint8Array}]
  const enc = new TextEncoder(), parts = [], central = [];
  let offset = 0;
  const now = dosTime(new Date());
  for (const f of files) {
    const nameB = enc.encode(f.name);
    const raw = f.data;
    let body = await deflateRaw(raw), method = 8;
    if (!body || body.length >= raw.length) { body = raw; method = 0; }
    const crc = crc32(raw);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0, true);
    lh.setUint16(8, method, true); lh.setUint16(10, now.t, true); lh.setUint16(12, now.d, true);
    lh.setUint32(14, crc, true); lh.setUint32(18, body.length, true); lh.setUint32(22, raw.length, true);
    lh.setUint16(26, nameB.length, true); lh.setUint16(28, 0, true);
    parts.push(new Uint8Array(lh.buffer), nameB, body);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true);
    ch.setUint16(8, 0, true); ch.setUint16(10, method, true);
    ch.setUint16(12, now.t, true); ch.setUint16(14, now.d, true);
    ch.setUint32(16, crc, true); ch.setUint32(20, body.length, true); ch.setUint32(24, raw.length, true);
    ch.setUint16(28, nameB.length, true); ch.setUint16(30, 0, true); ch.setUint16(32, 0, true);

  const eo = new DataView(new ArrayBuffer(22));
  eo.setUint32(0, 0x06054b50, true); eo.setUint16(4, 0, true); eo.setUint16(6, 0, true);
  eo.setUint16(8, files.length, true); eo.setUint16(10, files.length, true);
  eo.setUint32(12, cdSize, true); eo.setUint32(16, offset, true); eo.setUint16(20, 0, true);

async function exportFrames(scale, btn) {

/* ── autosave & crash recovery ──────────────────────────
   IndexedDB, because a project with embedded art routinely
   exceeds what localStorage will hold. Every call degrades to
   a silent no-op if storage is unavailable, so the tool still
   works from a read-only mount or a locked-down webview. */
const DB_NAME = 'parallax', STORE = 'sessions';
let dbP = null, autosaveOn = true, saveTimer = null, lastSaved = 0, sessionId = uid();
function db() {
  if (dbP) return dbP;
  dbP = new Promise((res, rej) => {
    let rq;
    try { rq = indexedDB.open(DB_NAME, 1); } catch (e) { return rej(e); }
    rq.onupgradeneeded = () => { if (!rq.result.objectStoreNames.contains(STORE)) rq.result.createObjectStore(STORE); };
    rq.onsuccess = () => res(rq.result);
    rq.onerror = () => rej(rq.error);
  }).catch(() => null);
  return dbP;
}
async function idbPut(key, val) {
  const d = await db(); if (!d) return false;
  return new Promise(res => {
    try {
      const tx = d.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).put(val, key);
      tx.oncomplete = () => res(true); tx.onerror = () => res(false);
    } catch (e) { res(false); }
  });
}
async function idbGet(key) {
  const d = await db(); if (!d) return null;
  return new Promise(res => {
    try {
      const rq = d.transaction(STORE, 'readonly').objectStore(STORE).get(key);
      rq.onsuccess = () => res(rq.result || null); rq.onerror = () => res(null);
    } catch (e) { res(null); }
  });
}
async function idbDel(key) {
  const d = await db(); if (!d) return;
  try { d.transaction(STORE, 'readwrite').objectStore(STORE).delete(key); } catch (e) { }
}
function snapshot() {
  return {
    savedAt: Date.now(), session: sessionId, name: P.name,
    project: P,
    assets: Object.values(A).map(a => ({ id: a.id, name: a.name, src: a.src, gif: a.gif || null })),
    sounds: Object.values(AU).map(a => ({ id: a.id, name: a.name, src: a.src }))
  };
}
function scheduleSave() {
  if (!autosaveOn) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    const ok = await idbPut('autosave', snapshot());
    if (ok) { lastSaved = Date.now(); updateSaveTag(); }
    else { autosaveOn = false; updateSaveTag('unavailable'); }
  }, 4000);
}
function updateSaveTag(force) {
  const el2 = $('#saveTag'); if (!el2) return;
  if (force === 'unavailable') { el2.textContent = 'autosave off'; el2.style.color = 'var(--dim)'; return; }
  if (!lastSaved) { el2.textContent = ''; return; }
  const secs = Math.round((Date.now() - lastSaved) / 1000);
  el2.textContent = secs < 8 ? 'saved' : 'saved ' + secs + 's ago';
  el2.style.color = 'var(--dim)';
}
setInterval(updateSaveTag, 5000);

async function offerRecovery() {
  const snap = await idbGet('autosave');
  if (!snap || !snap.project || snap.session === sessionId) return false;
  const age = Date.now() - snap.savedAt;
  const mins = Math.round(age / 60000);
  const when = mins < 1 ? 'less than a minute ago' : mins < 60 ? mins + ' minutes ago'
    : Math.round(mins / 60) + ' hours ago';
  return new Promise(res => {
    modal(`<h3>Unsaved work found</h3>
      <p>A project called <b>${esc(snap.name || 'untitled')}</b> was open when the app last
      closed, autosaved ${when}. Restore it?</p>
      <p style="color:var(--dim)">Discarding leaves the demo project loaded. This prompt will not appear again.</p>
      <div class="mrow"><button id="recNo">Discard</button>
        <button id="recYes" class="p">Restore</button></div>`, box => {
      box.querySelector('#recYes').onclick = () => {
        closeModal();
        loadProject(JSON.stringify({ version: 1, project: snap.project, assets: snap.assets, sounds: snap.sounds }));
        res(true);
      };
      box.querySelector('#recNo').onclick = async () => { await idbDel('autosave'); closeModal(); res(false); };
    });
  });
}

/* ── history ───────────────────────────────────────────── */
function push() {
  const s = JSON.stringify(P);
  if (hIdx >= 0 && hist[hIdx] === s) return;
  hist = hist.slice(0, hIdx + 1); hist.push(s);
  if (hist.length > 40) hist.shift();
  hIdx = hist.length - 1;
  updateHist(); scheduleSave(); scheduleSync();
}
function updateHist() { $('#bUndo').disabled = hIdx <= 0; $('#bRedo').disabled = hIdx >= hist.length - 1; }
function restore(i) {
  if (i < 0 || i >= hist.length) return;
  hIdx = i; P = JSON.parse(hist[i]);
  sel.shot = clamp(sel.shot, 0, P.shots.length - 1);
  sel.layer = clamp(sel.layer, 0, Math.max(0, P.shots[sel.shot].layers.length - 1));

}

$('#bHelp').onclick = () => modal(`<h3>How it works</h3>
<p><b>One idea:</b> a cutscene is a list of shots. Every shot is a stack of layers plus a camera and a grade. An "animation cut" is just a shot whose layer is a sprite sheet — so you can put an explosion on its own, or on top of a parallax scene, with the same tools.</p>
<p><b>Layers</b> are listed front to back. The coloured bar shows depth. Anchor a layer to the bottom edge and it sits on the floor of the frame no matter its height — that's how you get a strip of ground that only covers the lower part of the screen.</p>
<p><b>Parallax</b> multiplies the shot's camera pan. Foreground 1.5, subject 1.0, far hills 0.2, sky 0.05. <b>Speed x/y</b> is separate constant drift — turn on <code>tile x</code> so it wraps forever.</p>
<p><b>Transitions</b> belong to the shot they open. Chain as many animation shots as you like — the transition chips between shots in the list are clickable.</p>
<p><b>Keyframes:</b> the ◈ beside a slider turns that value into a track. Move the playhead, change the value, and a key is written automatically. Alt-click the diamond to clear the track. Keys appear in the lane under the timeline — drag to retime, double-click to delete.</p>
<p><b>Selective hit stop:</b> a stop freezes the shot, but each layer has an <i>ignore hit stop</i> amount. Leave it at 0 for scenery; push it to 1 on the impact VFX so the explosion keeps blooming while everything else holds. That contrast is what makes a hit feel heavy.</p>
<p><b>Events</b> are timestamps your engine listens for — spawn a scar, apply damage, cue the tactical camera. They ride in the exported data and never touch the rendered image, so frame exports stay identical.</p>
<p><b>Autosave:</b> work is checkpointed to local storage a few seconds after every change, and offered back if the app closes unexpectedly. Saving a project file clears the recovery copy — the file on disk is the real save.</p>
<p><b>Sheets:</b> generated sprite sheets often carry a baked-in backdrop and an odd grid. Hover an asset and hit <code>◧</code> to key out a magenta, white, or checkerboard background, then use <b>Auto-detect grid</b> on the anim layer. <b>First frame</b> skips a generator's reference cell, and <b>show grid</b> previews the slice on the canvas.</p>
<p><b>Distortion layers</b> bend whatever sits behind them — heat shimmer, shockwave ripple, scanline warp. Place one in front of the layers you want warped. <b>Motion blur</b> on a layer smears it along however far it moved since the last frame, so fast movement reads instead of strobing. Groups can now sit <b>inside other groups</b>, so a city can drift while a sub-group of it drifts further.</p>
<p><b>Auto-generate</b> in the Units tab reads a unit's actions and builds an approach → charge → fire → hit scene with timing, markers and a shockwave already in place. Edit from there. If a music cue is on the timeline, its <b>waveform</b> is drawn behind the shot strip so you can cut on the beat.</p>
<p><b>Graph editor</b> (∿) shows every track in the shot as a value curve, each normalized to its own range so different units read together. Drag a point to retime and revalue it; hold shift to change only time, alt to ignore marker snapping. Double-click for its curve, right-click to delete.</p>
<p><b>Markers</b> are named beats. Keyframes snap to them while dragging, so several layers land on the same instant exactly. <b>Sequence</b> lets a shot jump elsewhere, with optional conditions on your variables — turn on <i>follow branches</i> to preview the path a given set of variables takes.</p>
<p><b>Curves:</b> double-click a keyframe diamond for a bezier editor with draggable handles and eleven presets, including overshoot ones like <i>back out</i> and <i>anticipate</i>. Right-click a diamond deletes it. Keys with a custom curve are outlined amber.</p>
<p><b>Camera follow</b> keeps a chosen layer at a fixed fraction of the frame — amount 1 locks on, 0.3 drifts after it. <b>Onion skin</b> (◍) ghosts the selected layer at its neighbouring keys, magenta behind and cyan ahead. <b>Solo</b> (◎) hides everything else.</p>
<p><b>Library, batch and live sync:</b> save a shot as a template with its assets and insert it into any project. Batch render walks every unit through a slot and zips a sheet each. Live sync writes the engine JSON into a folder on every change, so a running game can hot-reload it.</p>
<p><b>Groups &amp; masks:</b> assign layers to a <b>group</b> and one set of offset/scale/opacity controls moves them together — keyframable, so a whole foreground can pull back at once. <b>Mask with</b> keeps a layer only where another layer has pixels; tick <i>use as mask only</i> on the shape so it cuts without drawing itself. Invert for the hole instead of the fill.</p>
<p><b>Story scenes:</b> <b>Panel</b> layers are 9-slice — set the insets and the corners hold their shape while the box resizes, so one piece of frame art serves every dialogue length. Text layers <b>wrap</b> and can <b>reveal</b> at a chosen characters-per-second for typed dialogue. The Add Shot menu has <i>Dialogue beat</i> and <i>Location card</i> presets built from these.</p>
<p><b>Feet &amp; attach points:</b> units plant on their feet — bottom-centre of the <i>opaque pixels</i>, not the padded frame box. "Pivot from artwork" in the Units tab finds them. Attach points are named spots on a sprite (muzzle, exhaust) that other layers ride, so a beam starts at the barrel instead of a hand-typed offset. The ridden layer must sit behind the rider.</p>
<p><b>Units &amp; slots:</b> a slot is a role (<code>ATTACKER</code>); a unit is a manifest of that role's actions, each with its own sheet, frame size and pivot. A layer asks for <code>{ATTACKER.fire}</code>, so frame data travels with the sheet and every unit can use its own dimensions. Set pivots when an action's frame box differs, or the unit will jump when it switches.</p>
<p><b>Palettes</b> swap exact colours for team tints. <b>Hit stops</b> freeze the frame mid-shot. Drag layers directly on the canvas; scroll to scale.</p>
<p><b>Handy:</b> copy a layer in one shot and paste it into another (⎘ ⎗) — its asset travels with it. Set a loop region with <code>[</code> and <code>]</code>. Number fields take arithmetic: <code>w/2</code>, <code>-h*0.25</code>.</p>
<p><b>Shortcuts:</b> <code>space</code> play · <code>←/→</code> step 1 frame · <code>,/.</code> previous/next shot · <code>K</code> key the selected layer's position · <code>Ctrl+Z</code> undo · drop PNGs anywhere to import.</p>`);

/* ── demo content (procedural placeholder pixel art) ───── */
function pc(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'); x.imageSmoothingEnabled = false; return [c, x]; }
function rngf(seed) { let s = seed; return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; }

function genSky() {
  const [c, x] = pc(320, 180);
  const g = x.createLinearGradient(0, 0, 0, 180);
  g.addColorStop(0, '#1a1038'); g.addColorStop(.45, '#4a2a5e'); g.addColorStop(.8, '#b8546a'); g.addColorStop(1, '#e8945c');
  x.fillStyle = g; x.fillRect(0, 0, 320, 180);
  const r = rngf(7);
  for (let i = 0; i < 70; i++) { const px = r() * 320, py = r() * 70; x.fillStyle = `rgba(255,240,220,${.2 + r() * .6})`; x.fillRect(px | 0, py | 0, 1, 1); }
  // banded clouds
  for (let i = 0; i < 7; i++) {
    const y = 40 + r() * 60, w = 40 + r() * 90;
    x.fillStyle = `rgba(255,190,170,${.08 + r() * .12})`;
    x.fillRect((r() * 320) | 0, y | 0, w | 0, (2 + r() * 4) | 0);
  }
  return c.toDataURL();
}
function genHills(w, h, top, bot, seed, jag) {
  const [c, x] = pc(w, h);
  const r = rngf(seed);
  const g = x.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, top); g.addColorStop(1, bot);
  x.fillStyle = g;
  let y = h * .55;
  x.beginPath(); x.moveTo(0, h);
  for (let px = 0; px <= w; px += 4) {
    y += (r() - .5) * jag;
    y = clamp(y, h * .2, h * .85);
    x.lineTo(px, Math.round(y));
  }
  x.lineTo(w, h); x.closePath(); x.fill();
  return c.toDataURL();
}
function genGround(w, h, c1, c2, seed) {
  const [c, x] = pc(w, h);
  const r = rngf(seed);
  x.fillStyle = c1; x.fillRect(0, 0, w, h);
  x.fillStyle = c2;
  for (let i = 0; i < w * h / 22; i++) x.fillRect((r() * w) | 0, (r() * h) | 0, 2, 1);
  x.fillStyle = 'rgba(255,255,255,.10)'; x.fillRect(0, 0, w, 1);
  x.fillStyle = 'rgba(0,0,0,.25)'; x.fillRect(0, h - 2, w, 2);
  return c.toDataURL();
}
function genUnit() {
  const [c, x] = pc(40, 26);
  const B = '#1c2440', M = '#3f7bd4', L = '#7fc4ff', D = '#101830', T = '#cfe6ff';
  x.fillStyle = D; x.fillRect(2, 16, 36, 8);
  x.fillStyle = B; x.fillRect(4, 17, 32, 5);
  for (let i = 0; i < 6; i++) { x.fillStyle = M; x.fillRect(5 + i * 5, 18, 3, 3); }
  x.fillStyle = M; x.fillRect(6, 8, 26, 9);
  x.fillStyle = L; x.fillRect(6, 8, 26, 2);
  x.fillStyle = D; x.fillRect(8, 12, 6, 3);
  x.fillStyle = T; x.fillRect(9, 13, 4, 1);
  x.fillStyle = M; x.fillRect(14, 4, 12, 6);
  x.fillStyle = L; x.fillRect(14, 4, 12, 1);
  x.fillStyle = D; x.fillRect(25, 6, 14, 2);
  x.fillStyle = B; x.fillRect(36, 5, 3, 4);
  return c.toDataURL();
}
function genProps() {
  const [c, x] = pc(160, 44);
  const r = rngf(3);
  for (let i = 0; i < 7; i++) {
    const px = 6 + i * 22 + r() * 6, hh = 14 + r() * 22, w = 6 + r() * 5;
    x.fillStyle = '#241a3a'; x.fillRect(px | 0, (44 - hh) | 0, w | 0, hh | 0);
    x.fillStyle = '#3a2a58'; x.fillRect(px | 0, (44 - hh) | 0, 2, hh | 0);
    if (r() > .5) { x.fillStyle = '#ffc85c'; x.fillRect((px + 2) | 0, (44 - hh + 4) | 0, 2, 2); }
  }
  return c.toDataURL();
}
function genExplosion() {
  const n = 8, s = 48;
  const [c, x] = pc(s * n, s);
  const r = rngf(11);
  for (let f = 0; f < n; f++) {
    const p = f / (n - 1);
    const cx = s * f + s / 2, cy = s / 2;
    const rad = 4 + p * 20;
    const rings = [
      [rad * 1.25, `rgba(255,90,40,${clamp(1 - p * 1.15, 0, 1) * .8})`],
      [rad, `rgba(255,160,50,${clamp(1 - p * .95, 0, 1)})`],
      [rad * .62, `rgba(255,232,150,${clamp(1 - p * .75, 0, 1)})`],
      [rad * .3, `rgba(255,255,255,${clamp(1 - p * 1.6, 0, 1)})`]
    ];
    rings.forEach(([rr, col]) => {
      x.fillStyle = col;
      // blocky circle for pixel feel
      for (let yy = -rr; yy <= rr; yy += 2) {
        const ww = Math.sqrt(Math.max(0, rr * rr - yy * yy));
        x.fillRect(Math.round(cx - ww), Math.round(cy + yy), Math.round(ww * 2), 2);
      }
    });
    // sparks
    for (let i = 0; i < 10; i++) {
      const ang = r() * TAU, d = rad * (.9 + r() * .8);
      x.fillStyle = `rgba(255,${180 + r() * 60 | 0},80,${clamp(1 - p, 0, 1)})`;
      x.fillRect(Math.round(cx + Math.cos(ang) * d), Math.round(cy + Math.sin(ang) * d), 2, 2);
    }
    // smoke on late frames
    if (p > .5) {
      x.fillStyle = `rgba(60,45,70,${(p - .5) * .9})`;
      for (let i = 0; i < 14; i++) {
        const ang = r() * TAU, d = r() * rad;
        x.fillRect(Math.round(cx + Math.cos(ang) * d), Math.round(cy + Math.sin(ang) * d - p * 6), 3, 3);
      }
    }
  }
  return c.toDataURL();
}

  P.shots = [s1, s2, s3, s4];
  sel = { shot: 0, layer: 0 }; time = 0; soloShot = false; $('#cSolo').checked = false;

}
